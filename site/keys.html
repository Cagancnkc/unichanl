<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Anahtarı Al · Unichanl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#050a0b;color:#e8efe6;font-family:'Archivo',sans-serif;min-height:100vh}
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:520px;background:#0a1214;border:1px solid #1a2528;border-radius:16px;padding:32px}
  h1{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
  p.sub{color:#8a9a94;font-size:14px;margin-bottom:24px}
  label{display:block;font-size:12px;color:#8a9a94;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
  input{width:100%;background:#050a0b;border:1px solid #1a2528;color:#e8efe6;padding:12px 14px;border-radius:10px;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
  input:focus{border-color:#DFFF00}
  .row{margin-bottom:16px}
  button{width:100%;background:#DFFF00;color:#050a0b;border:0;padding:14px;border-radius:10px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.02em;transition:filter .15s}
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .result{margin-top:24px;padding:18px;background:#050a0b;border:1px solid #DFFF00;border-radius:12px;display:none}
  .result.show{display:block}
  .result .warn{color:#DFFF00;font-size:12px;margin-bottom:10px;font-weight:600}
  .keybox{display:flex;gap:8px;align-items:stretch}
  code{flex:1;background:#0a1214;border:1px solid #1a2528;padding:10px 12px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px;word-break:break-all;color:#DFFF00}
  .copy{width:auto;padding:10px 14px;font-size:12px}
  .err{margin-top:16px;color:#ff6b6b;font-size:13px;display:none}
  .err.show{display:block}
  .meta{margin-top:10px;font-size:11px;color:#8a9a94;font-family:'JetBrains Mono',monospace}
  a.back{display:inline-block;margin-bottom:20px;color:#8a9a94;text-decoration:none;font-size:13px}
  a.back:hover{color:#DFFF00}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="back">← Ana sayfa</a>
  <h1>API Anahtarı Al</h1>
  <p class="sub">E-postanı ve isteğe bağlı bir isim gir. Anahtarın bir kez gösterilecek.</p>

  <form id="f">
    <div class="row">
      <label for="email">E-posta</label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="row">
      <label for="name">İsim (opsiyonel)</label>
      <input id="name" type="text" placeholder="örn. laptop-dev">
    </div>
    <button id="btn" type="submit">Anahtar Oluştur</button>
  </form>

  <div class="err" id="err"></div>

  <div class="result" id="result">
    <div class="warn">⚠ Bu anahtar bir daha gösterilmeyecek. Şimdi kopyala.</div>
    <div class="keybox">
      <code id="key"></code>
      <button class="copy" id="copy" type="button">Kopyala</button>
    </div>
    <div class="meta" id="meta"></div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <a href="/balance.html" style="flex:1;text-decoration:none"><button type="button" style="width:100%">Panele Git →</button></a>
      <a href="/apikeys.html" style="text-decoration:none"><button class="copy" type="button" style="background:transparent;color:#e8efe6;border:1px solid #1a2528">Anahtarlarım</button></a>
    </div>
  </div>
</div>

<script>
const f = document.getElementById('f');
const btn = document.getElementById('btn');
const err = document.getElementById('err');
const result = document.getElementById('result');
const keyEl = document.getElementById('key');
const meta = document.getElementById('meta');
const copyBtn = document.getElementById('copy');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  result.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Oluşturuluyor...';
  const email = document.getElementById('email').value.trim();
  const name = document.getElementById('name').value.trim();
  try {
    const r = await fetch('/api/keys/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(name ? { email, name } : { email }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data?.error?.message || 'İstek başarısız');
    keyEl.textContent = data.key;
    meta.textContent = `prefix: ${data.prefix} · keyId: ${data.keyId}`;
    try { localStorage.setItem('unichanl_key', data.key); } catch {}
    result.classList.add('show');
    f.reset();
  } catch (ex) {
    err.textContent = ex.message || String(ex);
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Anahtar Oluştur';
  }
});

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(keyEl.textContent);
    copyBtn.textContent = 'Kopyalandı ✓';
    setTimeout(() => copyBtn.textContent = 'Kopyala', 1500);
  } catch {
    copyBtn.textContent = 'Hata';
  }
});
</script>
</body>
</html>
