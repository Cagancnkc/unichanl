document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt:600 11px 'JetBrains Mono';letter-spacing:.1em;color:#657172;margin-bottom:8px\">VARSAYILAN YÖNLENDİRME MODU<\u002Fdiv><div style=\"display:flex;gap:0;background:#071114;border:1px solid #1C2A2D;border-radius:9px;padding:4px;width:fit-content\"><button sc-camel-on-click=\"{{ setRoutingMode }}\" data-mode=\"auto\" style=\"font:500 12.5px 'Archivo';cursor:pointer;border:none;border-radius:6px;padding:7px 16px;background:{{ modeBg.auto }};color:{{ modeFg.auto }}\">Otomatik<\u002Fbutton><button sc-camel-on-click=\"{{ setRoutingMode }}\" data-mode=\"cost\" style=\"font:500 12.5px 'Archivo';cursor:pointer;border:none;border-radius:6px;padding:7px 16px;background:{{ modeBg.cost }};color:{{ modeFg.cost }}\">Maliyet öncelikli<\u002Fbutton><button sc-camel-on-click=\"{{ setRoutingMode }}\" data-mode=\"latency\" style=\"font:500 12.5px 'Archivo';cursor:pointer;border:none;border-radius:6px;padding:7px 16px;background:{{ modeBg.latency }};color:{{ modeFg.latency }}\">Gecikme öncelikli<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;padding-top:6px\"><button sc-camel-on-click=\"{{ saveSettings }}\" style=\"font:600 13px 'Archivo';color:#03090B;background:var(--accent,#DFFF00);border:none;border-radius:9px;padding:10px 20px;cursor:pointer\" style-hover=\"filter:brightness(1.08)\">Değişiklikleri kaydet<\u002Fbutton><button sc-camel-on-click=\"{{ cancelSettings }}\" style=\"font:500 13px 'Archivo';color:#98A3A3;background:transparent;border:1px solid #1C2A2D;border-radius:9px;padding:10px 20px;cursor:pointer\" style-hover=\"color:#F2F5F4\">İptal<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ tabOther }}\">\n        <div style=\"max-width:620px;background:#071114;border:1px solid #1C2A2D;border-radius:12px;padding:40px;text-align:center\">\n          <div style=\"font-family:'Newsreader',serif;font-size:22px;margin-bottom:8px\">{{ tabTitle }}<\u002Fdiv>\n          <p style=\"font-size:13.5px;color:#657172;margin:0\">Bu bölüm hazırlandı ve bir sonraki adımda alanlarıyla doldurulmaya hazır.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n  <sc-if value=\"{{ toastMsg }}\">\n    <div style=\"position:fixed;bottom:24px;right:24px;background:#0B171A;border:1px solid var(--accent,#DFFF00);border-radius:10px;padding:12px 18px;font:500 13px 'Archivo';color:#F2F5F4;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:100;max-width:320px\">{{ toastMsg }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#DFFF00&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#DFFF00&quot;,&quot;#A3E635&quot;,&quot;#5EEAD4&quot;,&quot;#38BDF8&quot;]},&quot;initialPage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;models&quot;,&quot;providers&quot;,&quot;routing&quot;,&quot;requests&quot;,&quot;usage&quot;,&quot;apikeys&quot;,&quot;settings&quot;]}}\">\nclass Component extends DCLogic {\n  ALL_MODELS = [\n    { name:'gpt-5.6-luna', provider:'OpenAI', badge:'AI', tint:'#10A37F', cap:'Metin', input:'$0.08/M', output:'$0.48/M', latency:'0.7s', status:'Çalışıyor', statusColor:'#4ADE80' },\n    { name:'gpt-5.6-terra', provider:'OpenAI', badge:'AI', tint:'#10A37F', cap:'Çok modlu', input:'$0.80/M', output:'$4.80/M', latency:'1.1s', status:'Çalışıyor', statusColor:'#4ADE80' },\n    { name:'claude-opus-5', provider:'Anthropic', badge:'A', tint:'#D97757', cap:'Çok modlu', input:'$3.00/M', output:'$15.0/M', latency:'1.9s', status:'Çalışıyor', statusColor:'#4ADE80' },\n    { name:'claude-sonnet-5', provider:'Anthropic', badge:'A', tint:'#D97757', cap:'Metin', input:'$0.80/M', output:'$4.00/M', latency:'1.2s', status:'Çalışıyor', statusColor:'#4ADE80' },\n    { name:'gemini-2.5-pro', provider:'Google', badge:'G', tint:'#4285F4', cap:'Çok modlu', input:'$0.35/M', output:'$1.05/M', latency:'0.9s', status:'Sorunlu', statusColor:'#FBBF24' },\n    { name:'deepseek-v3', provider:'DeepSeek', badge:'D', tint:'#7C7CF7', cap:'Metin', input:'$0.14/M', output:'$0.28/M', latency:'1.6s', status:'Çalışıyor', statusColor:'#4ADE80' },\n    { name:'grok-4', provider:'xAI', badge:'X', tint:'#E5E5E5', cap:'Görsel', input:'$0.50/M', output:'$2.00/M', latency:'1.4s', status:'Çalışıyor', statusColor:'#4ADE80' },\n    { name:'glm-4.5-air', provider:'Z.ai', badge:'Z', tint:'#6E82F5', cap:'Metin', input:'$0.11/M', output:'$0.61/M', latency:'0.8s', status:'Çalışıyor', statusColor:'#4ADE80' },\n  ];\n\n  INTEGRATIONS = [\n    { id:'claude-code', name:'Claude Code', desc:'Kodlama ajanı', badge:'CC', tint:'#D97757', sdk:'anthropic', install:'npm install --global @anthropic-ai/claude-code\\nclaude --version', bin:'claude --model unichanl-brain' },\n    { id:'codex', name:'Codex', desc:'Kodlama ajanı', badge:'CX', tint:'#98A3A3', sdk:'openai', install:'npm install --global @openai/codex', bin:'codex' },\n    { id:'cursor', name:'Cursor', desc:'AI kod editörü', badge:'CU', tint:'#98A3A3', sdk:'openai', install:'Cursor → Ayarlar → Models → \"OpenAI API Key\" alanına anahtarınızı girin, Base URL olarak gateway adresini kullanın.', bin:null },\n    { id:'gemini-cli', name:'Gemini CLI', desc:'Ajan CLI', badge:'GM', tint:'#4285F4', sdk:'openai', install:'npm install --global @google/gemini-cli', bin:'gemini' },\n    { id:'opencode', name:'OpenCode', desc:'Kodlama ajanı', badge:'OC', tint:'#98A3A3', sdk:'openai', install:'curl -fsSL https://opencode.ai/install | bash', bin:'opencode' },\n    { id:'cline', name:'Cline', desc:'VS Code ajanı', badge:'CL', tint:'#98A3A3', sdk:'openai', install:'VS Code → Uzantılar → Cline → API Provider: \"OpenAI Compatible\" seçin.', bin:null },\n    { id:'langchain', name:'LangChain', desc:'Ajan çerçevesi', badge:'LC', tint:'#1FB6A8', sdk:'openai', install:'pip install langchain-openai', bin:null },\n    { id:'openai-node', name:'OpenAI Node', desc:'JavaScript SDK', badge:'AI', tint:'#10A37F', sdk:'openai', install:'npm install openai', bin:null },\n    { id:'openai-python', name:'OpenAI Python', desc:'Python SDK', badge:'AI', tint:'#10A37F', sdk:'openai', install:'pip install openai', bin:null },\n    { id:'vercel-ai', name:'Vercel AI SDK', desc:'AI çerçevesi', badge:'▲', tint:'#F2F5F4', sdk:'openai', install:'npm install ai @ai-sdk/openai', bin:null },\n    { id:'continue', name:'Continue', desc:'IDE asistanı', badge:'CN', tint:'#98A3A3', sdk:'openai', install:'VS Code → Uzantılar → Continue → config.json içine sağlayıcıyı ekleyin.', bin:null },\n    { id:'aider', name:'Aider', desc:'Terminal eşli programlama', badge:'AD', tint:'#4ADE80', sdk:'openai', install:'python -m pip install aider-install\\naider-install', bin:'aider' },\n  ];\n\n  state = {\n    page: this.props.initialPage || 'overview', settingsTab: 'profile', rowOpen: false, integrationSel: null,\n    toastMsg: '', modelSearch: '', capFilter: 'all', providerIdx: 0, sortDesc: true, rangeDays: 7,\n    routingMode: 'auto', balance: 0, topupAmount: '5', topupCustom: '5', hasToppedUp: false,\n    rules: [\n      { name:'Kodlama istekleri', match:'task = code', on:'#4ADE80', enabled:'Etkin', enabledColor:'#4ADE80', p1:'claude-opus-5', p1badge:'A', p1tint:'#D97757', p2:'gpt-5.6-terra', p2badge:'AI', p2tint:'#10A37F', p3:'gemini-2.5-pro', p3badge:'G', p3tint:'#4285F4', conditions:['Sağlayıcı erişilemez','Hız limiti','Gecikme > 4s','Model hatası'] },\n      { name:'Yüksek hacimli özetleme', match:'tokens > 8k', on:'#4ADE80', enabled:'Etkin', enabledColor:'#4ADE80', p1:'gemini-2.5-pro', p1badge:'G', p1tint:'#4285F4', p2:'deepseek-v3', p2badge:'D', p2tint:'#7C7CF7', p3:'gpt-5.6-luna', p3badge:'AI', p3tint:'#10A37F', conditions:['Bütçe aşıldı','Hız limiti','Sağlayıcı erişilemez'] },\n      { name:'Gecikme kritik', match:'stream = true', on:'#FBBF24', enabled:'Duraklatıldı', enabledColor:'#657172', p1:'gpt-5.6-luna', p1badge:'AI', p1tint:'#10A37F', p2:'claude-sonnet-5', p2badge:'A', p2tint:'#D97757', p3:'glm-4.5-air', p3badge:'Z', p3tint:'#6E82F5', conditions:['Gecikme > 2s','Sağlayıcı erişilemez'] },\n    ],\n    keys: [\n      { name:'Üretim', mask:'uc_live_••••••••4a9f', created:'12 Oca 2026', used:'2dk önce', requests:'1.24M', statusColor:'#4ADE80' },\n      { name:'Hazırlık', mask:'uc_live_••••••••7c21', created:'12 Oca 2026', used:'1sa önce', requests:'312K', statusColor:'#4ADE80' },\n      { name:'CI hattı', mask:'uc_live_••••••••e08b', created:'03 Şub 2026', used:'5sa önce', requests:'88K', statusColor:'#4ADE80' },\n      { name:'Yerel geliştirme', mask:'uc_live_••••••••1d55', created:'20 Şub 2026', used:'3g önce', requests:'12K', statusColor:'#657172' },\n    ],\n  };\n\n  toast = (msg) => {\n    this.setState({ toastMsg: msg });\n    clearTimeout(this._toastT);\n    this._toastT = setTimeout(() => this.setState({ toastMsg: '' }), 2400);\n  };\n\n  go = (e) => { const id = e.currentTarget.getAttribute('data-nav'); this.setState({ page: id, rowOpen: false }); };\n  selectIntegration = (e) => this.setState({ integrationSel: e.currentTarget.getAttribute('data-int') });\n  backIntegrations = () => this.setState({ integrationSel: null });\n  copyCmd = (e) => {\n    const text = e.currentTarget.getAttribute('data-copy');\n    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});\n    this.toast('Panoya kopyalandı');\n  };\n  setTab = (e) => { this.setState({ settingsTab: e.currentTarget.getAttribute('data-tab') }); };\n  openRow = () => this.setState({ rowOpen: true });\n  closeRow = () => this.setState({ rowOpen: false });\n\n  notifClick = () => this.toast('Yeni bildirim yok');\n  themeClick = () => this.toast('Aydınlık tema yakında geliyor');\n  docsClick = (e) => { e.preventDefault(); this.toast('Dokümanlar yakında yayında'); };\n  helpClick = (e) => { e.preventDefault(); this.toast('Destek ekibiyle bağlantı kuruluyor…'); };\n  headerNewKey = () => { this.createKey(); this.setState({ page: 'apikeys' }); };\n\n  setModelSearch = (e) => this.setState({ modelSearch: e.target.value });\n  setCap = (e) => this.setState({ capFilter: e.currentTarget.getAttribute('data-cap') });\n  cycleProvider = () => {\n    const provs = ['Tüm sağlayıcılar','OpenAI','Anthropic','Google','DeepSeek','xAI','Z.ai'];\n    this.setState(s => ({ providerIdx: (s.providerIdx + 1) % provs.length }));\n  };\n  cycleSort = () => this.setState(s => ({ sortDesc: !s.sortDesc }));\n  setRange = (e) => this.setState({ rangeDays: Number(e.currentTarget.getAttribute('data-range')) });\n\n  createRule = () => {\n    const names = ['Görsel analiz istekleri','Toplu veri işleme','Deneysel model testi'];\n    const name = names[this.state.rules.length % names.length] + ' ' + (this.state.rules.length + 1);\n    this.setState(s => ({ rules: [...s.rules, {\n      name, match:'custom', on:'#4ADE80', enabled:'Etkin', enabledColor:'#4ADE80',\n      p1:'claude-opus-5', p1badge:'A', p1tint:'#D97757',\n      p2:'gpt-5.6-terra', p2badge:'AI', p2tint:'#10A37F',\n      p3:'gemini-2.5-pro', p3badge:'G', p3tint:'#4285F4',\n      conditions:['Sağlayıcı erişilemez','Hız limiti'],\n    }] }));\n    this.toast('Yönlendirme kuralı oluşturuldu');\n  };\n  toggleRule = (e) => {\n    const name = e.currentTarget.getAttribute('data-rulename');\n    this.setState(s => ({ rules: s.rules.map(r => r.name === name ? (r.enabled === 'Etkin'\n      ? { ...r, enabled:'Duraklatıldı', enabledColor:'#657172', on:'#FBBF24' }\n      : { ...r, enabled:'Etkin', enabledColor:'#4ADE80', on:'#4ADE80' }) : r) }));\n    this.toast('Kural durumu güncellendi');\n  };\n\n  createKey = () => {\n    const n = this.state.keys.length + 1;\n    const mask = 'uc_live_••••••••' + Math.random().toString(16).slice(2,6);\n    this.setS <script>
(function () {

  function injectProps(payload) {
    return forEachEntry(function (name, entry) {
      if (!entry || typeof entry !== 'object') return;
      entry.propOverrides = Object.assign({}, entry.propOverrides || {}, payload);
      // registry.bump not exposed — trigger subs directly (equivalent to bump).
      if (entry.subs && typeof entry.subs.forEach === 'function') {
        entry.subs.forEach(function (s) { try { s(); } catch (e) { /* ignore */ } });
      }
    });
  }

  function waitForBundle(fn) {
    var attempts = 0;
    var iv = setInterval(function () {
      attempts++;
      if (typeof window.registry === 'function') {
        try {
          var pairs = Array.from(window.registry());
          if (pairs.length) { clearInterval(iv); fn(pairs); return; }
        } catch (e) { /* not ready */ }
      }
      if (attempts > 150) { clearInterval(iv); console.warn('[unichanl] bundle registry not found after 15s'); fn([]); }
    }, 100);
  }

  // Literal placeholders baked into the template that have no {{ binding }}.
  // Kept as text→text map. Only the balance card + savings pill are user-visible
  // real-value slots; model prices ($X.XX/M) come from the mock JS array inside
  // the template and get replaced when propOverrides.models kicks in.
  var patched = false;
  function buildLiteralMap(payload) {
    var s = payload.summary || {};
    var totalReq = s.totalRequests || 0;
    var totalReqStr = totalReq ? totalReq.toLocaleString('tr-TR') : '—';
    var totalTokens = s.totalTokens || 0;
    var totalTokensStr = totalTokens ? totalTokens.toLocaleString('tr-TR') : '—';
    var avgMs = Number(payload.avgLatency || 0);
    var latStr = avgMs > 0 ? (avgMs >= 1000 ? (avgMs / 1000).toFixed(1) + 's' : Math.round(avgMs) + 'ms') : '—';
    return {
      '12,842': totalReqStr,
      '▲ 8.2%': '',
      'geçen haftaya göre': '',
      '99.2%': '—',
      '▲ 0.3%': '',
      'yük devretmeler dahil': '',
      '1.8s': latStr,
      '▼ 0.2s': '',
      'modeller arası p50': '',
      '$42.18': payload.balanceStr,
      '$61.40 tasarruf': '',
      'yönlendirme ile': '',
      '89,204': totalReqStr,
      '402M': totalTokensStr,
      '$1,284.60': s.totalCostStr || '—'
    };
  }
  function patchLiterals(map) {
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var node, changed = false;
    while ((node = w.nextNode())) {
      var v = node.nodeValue;
      if (!v) continue;
      var out = v;
      for (var k in map) {
        if (out.indexOf(k) !== -1) out = out.split(k).join(map[k] || '');
      }
      if (out !== v) { node.nodeValue = out; changed = true; }
    }
    return changed;
  }

  window.__unichanl = { key: KEY, loading: true };

  function authHeaders() {
    return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY };
  }

  function showToast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;right:20px;bottom:20px;z-index:99999;background:#111;color:#DFFF00;border:1px solid #DFFF00;padding:12px 18px;border-radius:8px;font:14px system-ui;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = '1'; });
    setTimeout(function () {
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 250);
    }, 2600);
  }

  function detectAction(el) {
    var txt = (el.textContent || '').trim().toLowerCase();
    var closest = el.closest('[data-action]');
    if (closest && closest.dataset.action) return closest.dataset.action;
    if (/yeni anahtar|yeni api key|create.*key/i.test(txt)) return 'createKey';
    if (/^sil$|revoke|iptal.*key/i.test(txt)) return 'revokeKey';
    if (/yükle|top.?up|kredi.*yükle|bakiye.*yükle/i.test(txt)) return 'topup';
    if (/kaydet|save.*setting/i.test(txt)) return 'saveSettings';
    if (/yeni kural|create rule/i.test(txt)) return 'createRule';
    if (/kural.*sil|delete rule/i.test(txt)) return 'deleteRule';
    return null;
  }

  var refetching = false;
  function refetchAll() {
    if (refetching) return;
    refetching = true;
    fetchAll().then(function () { refetching = false; });
  }

  function fetchAll() {
    return Promise.all([
      j('/api/billing/balance'),
      j('/api/models'),
      j('/api/keys'),
      j('/api/usage?limit=50'),
      j('/api/providers'),
      j('/api/rules'),
      j('/api/sessions?limit=20'),
      j('/api/billing/subscription'),
      j('/api/dashboard/onboarding-status').catch(function () { return null; })
    ]).then(function (r) {
      var payload = normalize(r[0], r[1], r[2], r[3], r[4], r[5], r[6], r[7]);
      window.__unichanl = {
        key: KEY, loading: false,
        balance: r[0], models: r[1], keys: r[2], usage: r[3],
        providers: r[4], rules: r[5], sessions: r[6], subscription: r[7],
        onboarding: r[8],
        payload: payload
      };
      window.dispatchEvent(new CustomEvent('unichanl:data', { detail: window.__unichanl }));
      injectProps(payload);
      patchLiterals(buildLiteralMap(payload));
      return payload;
    });
  }

  document.body.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button,a,[role="button"]') : null;
    if (!t) return;
    var action = detectAction(t);
    if (!action) return;

    if (action === 'createKey') {
      e.preventDefault(); e.stopPropagation();
      var name = prompt('API key adı:', 'dashboard-' + Date.now().toString(36));
      if (!name) return;
      fetch('/api/keys', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ name: name }) })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.key) {
            prompt('Yeni API anahtarınız (bir daha gösterilmeyecek):', res.key);
            refetchAll();
          } else {
            showToast('Anahtar oluşturulamadı');
          }
        })
        .catch(function () { showToast('Anahtar oluşturulamadı'); });
    } else if (action === 'revokeKey') {
      e.preventDefault(); e.stopPropagation();
      var row = t.closest('[data-key-id]');
      var id = t.dataset.keyId || (row && row.dataset.keyId);
      if (!id) { showToast('Key ID bulunamadı'); return; }
      if (!confirm('Bu key silinsin mi?')) return;
      fetch('/api/keys/' + id, { method: 'DELETE', headers: authHeaders() })
        .then(function () { showToast('Anahtar iptal edildi'); refetchAll(); })
        .catch(function () { showToast('Silme başarısız'); });
    } else if (action === 'topup') {
      e.preventDefault(); e.stopPropagation();
      var amtStr = prompt('Yükleme miktarı (USD):', '10');
      if (!amtStr) return;
      var amt = parseFloat(amtStr);
      if (!isFinite(amt) || amt < 5) { showToast('Minimum $5'); return; }
      fetch('/api/billing/topup', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ amountUsd: amt, successUrl: location.origin + '/dashboard.html' })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.url) location.href = res.url;
          else showToast('Ödeme başlatılamadı');
        })
        .catch(function () { showToast('Ödeme başlatılamadı'); });
    } else if (action === 'saveSettings' || action === 'createRule' || action === 'deleteRule' || action === 'toggleRule') {
      e.preventDefault(); e.stopPropagation();
      showToast('Bu özellik yakında aktif olacak');
    }
  }, true);

  fetchAll().then(function (payload) {
    var literals = buildLiteralMap(payload);
    waitForBundle(function () {
      injectProps(payload);
      patchLiterals(literals);
      patched = true;

      var mo = new MutationObserver(function () {
        if (mo._pending) return;
        mo._pending = true;
        requestAnimationFrame(function () {
          mo._pending = false;
          var p = (window.__unichanl && window.__unichanl.payload) || payload;
          injectProps(p);
          patchLiterals(buildLiteralMap(p));
        });
      });
      mo.observe(document.body, { childList: true, subtree: true });
    });
  }).catch(function (e) {
    if (e && e.message === 'auth') return;
    console.error('[unichanl] data fetch failed', e);
  });
})();
</script>
<script src="/_onboarding.js" defer></script>
</body>
