<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#03090B;color:#F2F5F4;font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#DFFF00;text-decoration:none}
a:hover{color:#eaff5c}
button{font-family:inherit}
input,textarea,select{font-family:inherit}
::selection{background:rgba(223,255,0,.25);color:#fff}
.uc-scroll::-webkit-scrollbar{width:10px;height:10px}
.uc-scroll::-webkit-scrollbar-thumb{background:#1C2A2D;border-radius:8px;border:3px solid #03090B}
.uc-scroll::-webkit-scrollbar-track{background:transparent}
@keyframes ucpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ucfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.nav-btn{position:relative;display:flex;align-items:center;gap:11px;padding:9px 11px;border:none;border-radius:8px;cursor:pointer;text-align:left;font:500 13.5px 'Archivo',sans-serif;background:transparent;color:#98A3A3;width:100%;transition:background .12s,color .12s}
.nav-btn:hover{background:rgba(255,255,255,.04);color:#F2F5F4}
.nav-btn .bar{position:absolute;left:-12px;top:9px;bottom:9px;width:2px;border-radius:2px;background:#DFFF00;opacity:0;transition:opacity .12s}
.nav-btn.active{background:rgba(255,255,255,.04);color:#F2F5F4}
.nav-btn.active .bar{opacity:1}
.hd-btn{width:38px;height:38px;border-radius:9px;background:transparent;border:1px solid #1C2A2D;color:#98A3A3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.hd-btn:hover{background:#071114;color:#F2F5F4}
.card{background:#071114;border:1px solid #1C2A2D;border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:99px;font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.04em}
.pill.ok{background:rgba(74,222,128,.12);color:#4ADE80;border:1px solid rgba(74,222,128,.28)}
.pill.warn{background:rgba(255,214,107,.12);color:#FFD66B;border:1px solid rgba(255,214,107,.28)}
.pill.err{background:rgba(248,113,113,.12);color:#F87171;border:1px solid rgba(248,113,113,.28)}
.pill.mut{background:rgba(255,255,255,.04);color:#98A3A3;border:1px solid #1C2A2D}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;background:#DFFF00;border:none;color:#03090B;font:600 13px 'Archivo',sans-serif;cursor:pointer;transition:filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:#F2F5F4;border:1px solid #1C2A2D}
.btn.ghost:hover:not(:disabled){border-color:#DFFF00;color:#DFFF00}
.btn.danger{background:transparent;color:#F87171;border:1px solid rgba(248,113,113,.35);height:32px;padding:0 12px;font-size:12px}
.btn.danger:hover:not(:disabled){background:rgba(248,113,113,.1)}
.btn.sm{height:32px;padding:0 12px;font-size:12px}
.inp{background:#03090B;border:1px solid #1C2A2D;border-radius:9px;padding:10px 12px;color:#F2F5F4;font:400 13.5px 'Archivo',sans-serif;outline:none;transition:border-color .12s;width:100%}
.inp:focus{border-color:#DFFF00}
.crumb{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#4C5758;margin-bottom:10px}
.h1{font-family:'Newsreader',serif;font-weight:400;font-size:46px;line-height:1;margin:0 0 12px;letter-spacing:-.01em;color:#F2F5F4}
.sub{font-size:15px;color:#98A3A3;margin:0 0 28px;max-width:640px;line-height:1.5}
.mono{font-family:'JetBrains Mono',monospace}
.stat{background:#071114;border:1px solid #1C2A2D;border-radius:12px;padding:18px 18px 16px}
.stat .lbl{font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#657172;margin-bottom:14px}
.stat .val{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;color:#F2F5F4}
.stat .sub2{font-size:12px;color:#657172}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:10px 14px;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.1em;color:#4C5758;border-bottom:1px solid #132023;background:transparent}
.tbl td{padding:13px 14px;font-size:13px;color:#C7CFCE;border-bottom:1px solid #0C171A}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.empty{padding:44px 24px;text-align:center;color:#657172;font-size:14px}
.view{animation:ucfade .18s ease}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(3,9,11,.82);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(4px)}
.modal-card{background:#0A1416;border:1px solid #1C2A2D;border-radius:16px;padding:28px;max-width:460px;width:100%;animation:ucfade .18s ease}
.toast{position:fixed;right:24px;bottom:24px;z-index:300;padding:12px 18px;border-radius:10px;font:500 13.5px 'Archivo';box-shadow:0 8px 32px rgba(0,0,0,.5);display:none;animation:ucfade .18s ease;max-width:360px}
.toast.show{display:block}
.toast.ok{background:#071114;color:#DFFF00;border:1px solid rgba(223,255,0,.4)}
.toast.err{background:#171012;color:#F87171;border:1px solid rgba(248,113,113,.4)}
.toast.info{background:#071114;color:#F2F5F4;border:1px solid #1C2A2D}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:#0B171A;border:1px solid #1C2A2D;font:500 11.5px 'JetBrains Mono',monospace;color:#98A3A3;cursor:pointer;transition:all .12s}
.chip:hover{border-color:#4C5758;color:#F2F5F4}
.chip.active{background:rgba(223,255,0,.08);border-color:rgba(223,255,0,.35);color:#DFFF00}
.copy{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;background:transparent;border:1px solid #1C2A2D;color:#98A3A3;font:500 11px 'JetBrains Mono',monospace;cursor:pointer;transition:all .12s}
.copy:hover{border-color:#DFFF00;color:#DFFF00}
.link{color:#98A3A3;background:transparent;border:none;cursor:pointer;font:500 12px 'Archivo';padding:0}
.link:hover{color:#DFFF00}
pre.code{background:#03090B;border:1px solid #1C2A2D;border-radius:9px;padding:12px 14px;font:12px 'JetBrains Mono',monospace;color:#F2F5F4;overflow-x:auto;white-space:pre;line-height:1.55}
.row-split{display:flex;justify-content:space-between;align-items:center;gap:16px}
.section-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #132023}

.togg{position:relative;display:inline-flex;align-items:center;width:38px;height:22px;background:#1C2A2D;border-radius:99px;cursor:pointer;transition:background .12s;border:none;padding:0}
.togg::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#657172;transition:all .12s}
.togg.on{background:rgba(223,255,0,.25)}
.togg.on::after{background:#DFFF00;left:18px}
@media (max-width:900px){.h1{font-size:34px}.stat .val{font-size:24px}}
</style>

<script type="module">
const KEY_STORAGE='unichanl_key';
const getKey=()=>localStorage.getItem(KEY_STORAGE);
const clearKey=()=>localStorage.removeItem(KEY_STORAGE);

if(!getKey()){location.replace('/signup.html');}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUsd=v=>{const n=typeof v==='number'?v:parseFloat(v);if(!Number.isFinite(n))return '$0.00';return '$'+n.toFixed(n>=100?2:(n>=1?4:6));};
const fmtInt=v=>{const n=typeof v==='number'?v:parseInt(v,10);if(!Number.isFinite(n))return '0';return n.toLocaleString('tr-TR');};
const fmtDate=iso=>{if(!iso)return '—';const d=new Date(iso);return Number.isNaN(d.getTime())?'—':d.toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:'short'});};
const fmtTimeShort=iso=>{if(!iso)return '—';const d=new Date(iso);if(Number.isNaN(d.getTime()))return '—';const now=Date.now();const diff=Math.floor((now-d.getTime())/1000);if(diff<60)return diff+'s önce';if(diff<3600)return Math.floor(diff/60)+'d önce';if(diff<86400)return Math.floor(diff/3600)+'sa önce';return d.toLocaleDateString('tr-TR',{month:'short',day:'numeric'});};

async function api(path,opts={}){
  const key=getKey();
  if(!key)throw new Error('no_key');
  const headers={Authorization:'Bearer '+key,...(opts.headers||{})};
  if(opts.body&&!headers['Content-Type'])headers['Content-Type']='application/json';
  const r=await fetch(path,{...opts,headers});
  if(r.status===401){clearKey();location.replace('/signup.html');throw new Error('auth');}
  if(r.status===204)return null;
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data?.error?.message||'HTTP '+r.status);
  return data;
}

let toastTimer=null;
function toast(msg,type='info'){
  const el=$('#toast');
  el.className='toast '+type+' show';
  el.textContent=msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.classList.remove('show');},2800);
}
window.ucToast=toast;

function modal(html,{onClose,onMount}={}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="modal"><div class="modal-card">${html}</div></div>`;
  const overlay=root.firstElementChild;
  const close=()=>{root.innerHTML='';onClose&&onClose();};
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  document.addEventListener('keydown',function ec(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',ec);}});
  if(onMount)onMount(root,close);
  return close;
}

const VIEWS=['overview','models','providers','routing','requests','usage','apikeys','settings','integrations','pricing'];

function setActive(name){
  $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));
  VIEWS.forEach(v=>{const el=$('#view-'+v);if(el)el.classList.toggle('hidden',v!==name);});
}

async function showView(name){
  if(!VIEWS.includes(name))name='overview';
  setActive(name);
  $('#main').scrollTop=0;
  try{await LOADERS[name]();}catch(err){
    console.error('view load',name,err);
    if(err.message!=='auth')toast(err.message||'Yükleme başarısız','err');
  }
}

function navigateTo(name){
  if(location.hash!=='#/'+name){location.hash='#/'+name;}else{showView(name);}
}

window.addEventListener('hashchange',()=>{const n=(location.hash||'').replace(/^#\//,'')||'overview';showView(n);});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav]');
  if(t){e.preventDefault();navigateTo(t.dataset.nav);}
});

const LOADERS={};

function statCard(lbl,val,sub){
  return `<div class="stat"><div class="lbl">${esc(lbl)}</div><div class="val">${esc(val)}</div><div class="sub2">${esc(sub||'')}</div></div>`;
}

function buildLineChart(daily){
  const W=560,H=180,PAD=8;
  if(!daily||!daily.length){
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
      <line x1="0" y1="45" x2="${W}" y2="45" stroke="#132023"/><line x1="0" y1="90" x2="${W}" y2="90" stroke="#132023"/><line x1="0" y1="135" x2="${W}" y2="135" stroke="#132023"/>
      <text x="${W/2}" y="${H/2+4}" text-anchor="middle" fill="#4C5758" font-family="JetBrains Mono" font-size="11">Henüz veri yok</text>
    </svg>`;
  }
  const points=daily.map(d=>({t:new Date(d.date||d.day).getTime(),v:Number(d.count||d.requests||d.total||0)}));
  const maxV=Math.max(1,...points.map(p=>p.v));
  const step=(W-PAD*2)/Math.max(1,points.length-1);
  const coords=points.map((p,i)=>[PAD+i*step,H-PAD-((p.v/maxV)*(H-PAD*2))]);
  const line=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=line+` L ${(PAD+(points.length-1)*step).toFixed(1)} ${H-PAD} L ${PAD} ${H-PAD} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
    <defs><linearGradient id="ucfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DFFF00" stop-opacity="0.22"/><stop offset="1" stop-color="#DFFF00" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" y1="45" x2="${W}" y2="45" stroke="#132023"/><line x1="0" y1="90" x2="${W}" y2="90" stroke="#132023"/><line x1="0" y1="135" x2="${W}" y2="135" stroke="#132023"/>
    <path d="${area}" fill="url(#ucfill)"/><path d="${line}" fill="none" stroke="#DFFF00" stroke-width="2" stroke-linejoin="round"/>
  </svg>`;
}

function buildBarChart(daily){
  const W=800,H=180,PAD=8;
  if(!daily||!daily.length)return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#4C5758" font-family="JetBrains Mono" font-size="12">Bu dönemde veri yok</text></svg>`;
  const pts=daily.map(d=>({t:d.date||d.day,v:Number(d.count||d.requests||d.total||0)}));
  const maxV=Math.max(1,...pts.map(p=>p.v));
  const bw=(W-PAD*2)/pts.length-3;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
    <line x1="0" y1="45" x2="${W}" y2="45" stroke="#132023"/><line x1="0" y1="90" x2="${W}" y2="90" stroke="#132023"/><line x1="0" y1="135" x2="${W}" y2="135" stroke="#132023"/>
    ${pts.map((p,i)=>{const h=(p.v/maxV)*(H-PAD*2);const x=PAD+i*(bw+3);return `<rect x="${x.toFixed(1)}" y="${(H-PAD-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="#DFFF00" opacity="${p.v?0.85:0.15}" rx="2"/>`;}).join('')}
  </svg>`;
}

async function refreshKeys(){
  const data=await api('/api/keys');
  const keys=data?.keys||[];
  window.__unichanl=window.__unichanl||{};window.__unichanl.keys=keys;
  const b=$('#keys-body');
  if(!keys.length){b.innerHTML='<div class="empty">Henüz anahtar yok.</div>';return;}
  b.innerHTML=`<table class="tbl">
    <thead><tr><th>AD</th><th>ÖN EK</th><th>OLUŞTURMA</th><th style="text-align:right">İSTEK</th><th>SON KULLANIM</th><th></th></tr></thead>
    <tbody>${keys.map(k=>`<tr>
      <td><span style="color:#F2F5F4;font-weight:600">${esc(k.name||'—')}</span></td>
      <td class="mono" style="font-size:12px;color:#DFFF00">${esc(k.keyPrefix||'—')}…</td>
      <td class="mono" style="font-size:12px;color:#98A3A3">${esc(fmtDate(k.createdAt))}</td>
      <td class="mono" style="text-align:right;color:#C7CFCE">${fmtInt(k.usage?.requestCount||0)}</td>
      <td class="mono" style="font-size:12px;color:#657172">${esc(fmtTimeShort(k.usage?.lastUsedAt))}</td>
      <td style="text-align:right">${k.enabled?`<button class="btn danger" data-revoke="${esc(k.id)}">İptal</button>`:'<span class="pill mut">İptal edildi</span>'}</td>
    </tr>`).join('')}</tbody></table>`;
  $$('[data-revoke]',b).forEach(btn=>btn.addEventListener('click',async(e)=>{
    e.stopPropagation();
    if(!confirm('Bu anahtarı iptal etmek istediğine emin misin?'))return;
    btn.disabled=true;
    try{await api('/api/keys/'+encodeURIComponent(btn.dataset.revoke),{method:'DELETE'});toast('Anahtar iptal edildi','ok');await refreshKeys();}
    catch(err){toast(err.message||'İptal başarısız','err');btn.disabled=false;}
  }));
}

function openCreateKeyModal(){
  modal(`
    <h3 style="font-family:'Newsreader',serif;font-weight:400;font-size:26px;margin:0 0 8px">Yeni API Anahtarı</h3>
    <p style="color:#98A3A3;font-size:13px;margin:0 0 20px;line-height:1.5">Anahtara bir ad ver. Oluşturulduktan sonra tam değer <strong style="color:#DFFF00">yalnızca bir kez</strong> gösterilecek.</p>
    <div style="margin-bottom:16px"><label style="display:block;font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:8px;text-transform:uppercase">Anahtar Adı</label><input id="k-name" class="inp" placeholder="Örn: prod-cli" autofocus></div>
    <div style="display:flex;gap:10px;margin-top:24px"><button class="btn" id="k-create" style="flex:1">Oluştur</button><button class="btn ghost" id="k-cancel">Vazgeç</button></div>
  `,{onMount:(root,close)=>{
    $('#k-cancel',root).addEventListener('click',close);
    const doCreate=async()=>{
      const btn=$('#k-create',root);const name=($('#k-name',root).value||'').trim()||'anahtar-'+Date.now().toString(36);
      btn.disabled=true;
      try{
        const res=await api('/api/keys',{method:'POST',body:JSON.stringify({name})});
        close();
        showRevealKey(res.key,name);
      }catch(err){toast(err.message||'Oluşturulamadı','err');btn.disabled=false;}
    };
    $('#k-create',root).addEventListener('click',doCreate);
    $('#k-name',root).addEventListener('keydown',e=>{if(e.key==='Enter')doCreate();});
  }});
}

function showRevealKey(key,name){
  modal(`
    <h3 style="font-family:'Newsreader',serif;font-weight:400;font-size:26px;margin:0 0 8px">Anahtarını Kaydet</h3>
    <p style="color:#F87171;font-size:13px;margin:0 0 16px;line-height:1.5"><strong>Bir daha gösterilmeyecek.</strong> Güvenli bir yerde sakla.</p>
    <div style="background:#03090B;border:1px solid #DFFF00;border-radius:9px;padding:14px;margin-bottom:16px">
      <div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:8px">${esc(name)}</div>
      <div class="mono" id="k-value" style="font-size:12.5px;color:#DFFF00;word-break:break-all;line-height:1.5">${esc(key)}</div>
    </div>
    <div style="display:flex;gap:10px"><button class="btn" id="k-copy" style="flex:1">Kopyala</button><button class="btn ghost" id="k-done">Kapat</button></div>
  `,{onMount:(root,close)=>{
    $('#k-done',root).addEventListener('click',async()=>{close();await refreshKeys();});
    $('#k-copy',root).addEventListener('click',async()=>{
      try{await navigator.clipboard.writeText(key);toast('Kopyalandı','ok');}catch(_){toast('Kopyalanamadı','err');}
    });
  }});
}

async function refreshPricing(){
  const [bal,rc,sub]=await Promise.all([
    api('/api/billing/balance').catch(()=>null),
    api('/api/billing/recharge-settings').catch(()=>null),
    api('/api/billing/subscription').catch(()=>null),
  ]);
  $('#bal-val').textContent=fmtUsd(bal?.balanceUsd||0);
  $('#bal-sub').textContent=bal?'kullanıma hazır':'—';
  if(rc){
    $('#ar-tog').classList.toggle('on',!!rc.autoRechargeEnabled);
    $('#ar-info').textContent='Eşik: $'+rc.autoRechargeThreshold+' · Yüklenecek: $'+rc.autoRechargeAmount;
  }
  const tx=$('#tx-body');
  const txs=bal?.recentTransactions||[];
  if(!txs.length){tx.innerHTML='<div class="empty" style="padding:20px 0">Henüz işlem yok.</div>';}
  else{
    tx.innerHTML=`<table class="tbl"><thead><tr><th>TARİH</th><th>TÜR</th><th style="text-align:right">TUTAR</th><th style="text-align:right">BAKİYE</th></tr></thead><tbody>${txs.map(t=>{
      const amt=parseFloat(t.amountUsd);const sign=amt>=0?'+':'-';const col=amt>=0?'#4ADE80':'#F87171';
      return `<tr><td class="mono" style="font-size:12px;color:#98A3A3">${esc(fmtDate(t.createdAt))}</td>
        <td class="mono" style="font-size:12px;color:#C7CFCE">${esc(t.type)}</td>
        <td class="mono" style="text-align:right;color:${col}">${sign}${fmtUsd(Math.abs(amt))}</td>
        <td class="mono" style="text-align:right;color:#98A3A3">${fmtUsd(t.balanceAfter)}</td></tr>`;
    }).join('')}</tbody></table>`;
  }
  const sb=$('#sub-body');
  if(!sub?.subscription){sb.innerHTML='<div style="color:#98A3A3;font-size:13px">Aktif bir abonelik yok. Sadece kredi bazlı kullanım aktif.</div>';}
  else{
    const s=sub.subscription;
    sb.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
      <div><div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:4px">SEVİYE</div><div style="color:#F2F5F4;font-weight:600">${esc(s.tier)}</div></div>
      <div><div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:4px">DURUM</div><div>${s.status==='active'?'<span class="pill ok">Aktif</span>':'<span class="pill warn">'+esc(s.status)+'</span>'}</div></div>
      <div><div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:4px">DÖNEM BİTİŞ</div><div class="mono" style="font-size:12px;color:#C7CFCE">${esc(fmtDate(s.currentPeriodEnd))}</div></div>
    </div>`;
  }
}
