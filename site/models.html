<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modeller · Unichanl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="s"></style>
</head>
<body>
<div class="wrap">
  <div id="nav"></div>
  <div id="app"></div>
</div>

<script type="module">
import { api, getKey, mountNav, baseCss } from './_ui.js';
document.getElementById('s').textContent = baseCss;

const app = document.getElementById('app');

function stateBadge(s) {
  const cls = s === 'closed' ? 'ok' : s === 'half-open' ? 'warn' : 'err';
  return `<span class="badge ${cls}">${s}</span>`;
}

function money(v) {
  const n = typeof v === 'number' ? v : parseFloat(v);
  if (!Number.isFinite(n)) return '—';
  return '$' + n.toFixed(6) + '/1K';
}

async function load() {
  mountNav('models');
  app.innerHTML = `
    <div class="card">
      <h1>Modeller</h1>
      <p class="sub">Kullanılabilir modeller ve circuit breaker durumu.</p>
      <div id="wrap"></div>
    </div>
    <div class="err" id="err"></div>`;
  try {
    const data = await api('/api/models');
    const models = data.models || [];
    const wrap = document.getElementById('wrap');
    if (models.length === 0) {
      wrap.innerHTML = '<div class="empty">Kayıtlı model yok.</div>';
      return;
    }
    wrap.innerHTML = `<table><thead><tr>
      <th>Model</th><th>Provider</th><th>Input Fiyat</th><th>Output Fiyat</th><th>Context</th><th>Circuit</th>
    </tr></thead><tbody>${models.map(m => `<tr>
      <td>
        <div style="font-weight:600">${m.displayName || m.id}</div>
        <div class="mono" style="color:#8a9a94;font-size:11px">${m.id}</div>
      </td>
      <td>${m.provider || '—'}</td>
      <td class="mono">${money(m.inputCostPer1k)}</td>
      <td class="mono">${money(m.outputCostPer1k)}</td>
      <td class="mono">${(m.contextWindow ?? 0).toLocaleString('tr-TR')}</td>
      <td>${stateBadge(m.circuitState || 'closed')}</td>
    </tr>`).join('')}</tbody></table>`;
  } catch (ex) {
    if (ex.message === 'auth' || ex.message === 'no_key') return;
    const err = document.getElementById('err');
    err.textContent = ex.message;
    err.classList.add('show');
  }
}

if (!getKey()) location.href = '/signup.html';
else load();
</script>
</body>
</html>
