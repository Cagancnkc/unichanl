<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş yapılıyor… · Unichanl</title>
<style>
  body { background: #03090B; color: #F2F5F4; font-family: 'Archivo', sans-serif; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .container { text-align: center; }
  .spinner { width: 48px; height: 48px; border: 3px solid #1C2A2D; border-top-color: #DFFF00; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { font-size: 16px; color: #98A3A3; }
  .error { color: #ff6b6b; font-size: 14px; margin-top: 16px; }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9FCSTD2HG9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-9FCSTD2HG9');
</script>
</head>
<body>
<div class="container">
  <div class="spinner"></div>
  <div class="text">Giriş yapılıyor…</div>
  <div class="error" id="err"></div>
</div>

<script>
const errEl = document.getElementById('err');
const textEl = document.querySelector('.text');

function showError(msg) {
  console.error('[callback]', msg);
  errEl.textContent = 'Hata: ' + msg;
  setTimeout(() => { location.href = '/signup.html'; }, 3000);
}

const hashParams = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const queryParams = new URLSearchParams(location.search);
const urlError = hashParams.get('error_description') || hashParams.get('error') || queryParams.get('error_description') || queryParams.get('error');
const accessToken = hashParams.get('access_token');

console.log('[callback] hash keys:', Array.from(hashParams.keys()));
console.log('[callback] access_token present:', !!accessToken);

async function exchange(token) {
  try {
    textEl.textContent = 'Hesap oluşturuluyor…';
    console.log('[callback] posting to /api/auth/google');
    const r = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: token }),
    });
    console.log('[callback] exchange status', r.status);
    const data = await r.json().catch(() => ({}));
    console.log('[callback] exchange body', data);
    if (!r.ok || !data.key) return showError(data.error || ('HTTP ' + r.status));
    localStorage.setItem('unichanl_key', data.key);
    location.href = '/dashboard.html';
  } catch (e) {
    console.error('[callback] fetch failed', e);
    showError(e.message || 'network');
  }
}

if (urlError) {
  showError(decodeURIComponent(urlError));
} else if (accessToken) {
  exchange(accessToken);
} else {
  showError('access_token yok (URL hash boş)');
}
</script>
</body>
</html>
