<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kullanım · Unichanl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="s"></style>
</head>
<body>
<div class="wrap">
  <div id="nav"></div>
  <div id="app"></div>
</div>

<script type="module">
import { api, getKey, mountNav, baseCss, fmtUsd, fmtDate } from './_ui.js';
document.getElementById('s').textContent = baseCss;

const app = document.getElementById('app');

async function load() {
  mountNav('usage');
  app.innerHTML = `
    <div class="card">
      <h1>Kullanım</h1>
      <p class="sub">Son 30 gün.</p>
      <div class="grid" id="metrics"></div>
    </div>
    <div class="card">
      <h2>Model Bazında</h2>
      <div id="byModel"></div>
    </div>
    <div class="card">
      <h2>Son İstekler</h2>
      <div id="recent"></div>
    </div>
    <div class="err" id="err"></div>`;
  try {
    const data = await api('/api/usage?limit=50');
    const s = data.summary || {};
    document.getElementById('metrics').innerHTML = `
      ${metric('Toplam İstek', (s.totalRequests ?? 0).toLocaleString('tr-TR'))}
      ${metric('Toplam Token', (s.totalTokens ?? 0).toLocaleString('tr-TR'))}
      ${metric('Toplam Maliyet', fmtUsd(s.totalCostUsd ?? 0))}
    `;

    const bm = data.byModel || [];
    document.getElementById('byModel').innerHTML = bm.length === 0
      ? '<div class="empty">Kullanım verisi yok.</div>'
      : `<table><thead><tr>
          <th>Model</th><th>Provider</th><th>İstek</th><th>Input Tok</th><th>Output Tok</th><th>Maliyet</th><th>Ort. Gecikme</th>
        </tr></thead><tbody>${bm.map(m => `<tr>
          <td class="mono">${m.modelId}</td>
          <td>${m.provider}</td>
          <td class="mono">${m._count?.id ?? 0}</td>
          <td class="mono">${(m._sum?.inputTokens ?? 0).toLocaleString('tr-TR')}</td>
          <td class="mono">${(m._sum?.outputTokens ?? 0).toLocaleString('tr-TR')}</td>
          <td class="mono">${fmtUsd(m._sum?.totalCostUsd ?? 0)}</td>
          <td class="mono">${m._avg?.latencyMs ? Math.round(m._avg.latencyMs) + 'ms' : '—'}</td>
        </tr>`).join('')}</tbody></table>`;

    const rec = data.recent || [];
    document.getElementById('recent').innerHTML = rec.length === 0
      ? '<div class="empty">Henüz istek yok.</div>'
      : `<table><thead><tr>
          <th>Tarih</th><th>Model</th><th>Token (in/out)</th><th>Maliyet</th><th>Gecikme</th><th>Failover</th>
        </tr></thead><tbody>${rec.map(r => `<tr>
          <td>${fmtDate(r.createdAt)}</td>
          <td class="mono">${r.modelId}</td>
          <td class="mono">${r.inputTokens ?? 0} / ${r.outputTokens ?? 0}</td>
          <td class="mono">${fmtUsd(r.totalCostUsd ?? 0)}</td>
          <td class="mono">${r.latencyMs ?? 0}ms</td>
          <td>${r.wasFailover ? '<span class="badge warn">yes</span>' : '<span class="badge ok">no</span>'}</td>
        </tr>`).join('')}</tbody></table>`;
  } catch (ex) {
    if (ex.message === 'auth' || ex.message === 'no_key') return;
    const err = document.getElementById('err');
    err.textContent = ex.message;
    err.classList.add('show');
  }
}

function metric(lbl, val) {
  return `<div class="metric"><div class="lbl">${lbl}</div><div class="val">${val}</div></div>`;
}

if (!getKey()) location.href = '/signup.html';
else load();
</script>
</body>
</html>
