<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş yapılıyor… · Unichanl</title>
<style>
  body { background: #03090B; color: #F2F5F4; font-family: 'Archivo', sans-serif; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .container { text-align: center; }
  .spinner { width: 48px; height: 48px; border: 3px solid #1C2A2D; border-top-color: #DFFF00; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { font-size: 16px; color: #98A3A3; }
  .error { color: #ff6b6b; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <div class="spinner"></div>
  <div class="text">Giriş yapılıyor…</div>
  <div class="error" id="err"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bqycnltbdhconcjdmdml.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0gZpwTUpFhSK3vNtfojT-w_StHriUNP';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { detectSessionInUrl: true, persistSession: true, flowType: 'implicit' }
});
const errEl = document.getElementById('err');

function showError(msg) {
  console.error('[callback]', msg);
  errEl.textContent = 'Hata: ' + msg;
  setTimeout(() => { location.href = '/signup.html'; }, 3000);
}

const hashParams = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const queryParams = new URLSearchParams(location.search);
const urlError = hashParams.get('error_description') || hashParams.get('error') || queryParams.get('error_description') || queryParams.get('error');
if (urlError) {
  showError(decodeURIComponent(urlError));
}

let done = !!urlError;

async function exchange(session) {
  try {
    const r = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: session.access_token }),
    });
    console.log('[callback] exchange status', r.status);
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.key) return showError(data.error || ('HTTP ' + r.status));
    localStorage.setItem('unichanl_key', data.key);
    location.href = '/balance.html';
  } catch (e) {
    showError(e.message || 'network');
  }
}

supabase.auth.onAuthStateChange((event, session) => {
  console.log('[callback] authStateChange', event, !!session);
  if (done || !session) return;
  if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
    done = true;
    exchange(session);
  }
});

setTimeout(async () => {
  if (done) return;
  const { data: { session } } = await supabase.auth.getSession();
  if (session) { done = true; exchange(session); }
  else { done = true; showError('Session alınamadı (timeout)'); }
}, 3000);
</script>
</body>
</html>
