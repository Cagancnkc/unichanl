<script type="module">
const KEY_STORAGE='unichanl_key';
const getKey=()=>localStorage.getItem(KEY_STORAGE);
const clearKey=()=>localStorage.removeItem(KEY_STORAGE);

if(!getKey()){location.replace('/signup.html');}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUsd=v=>{const n=typeof v==='number'?v:parseFloat(v);if(!Number.isFinite(n))return '$0.00';return '$'+n.toFixed(n>=100?2:(n>=1?4:6));};
const fmtInt=v=>{const n=typeof v==='number'?v:parseInt(v,10);if(!Number.isFinite(n))return '0';return n.toLocaleString('tr-TR');};
const fmtDate=iso=>{if(!iso)return '—';const d=new Date(iso);return Number.isNaN(d.getTime())?'—':d.toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:'short'});};
const fmtTimeShort=iso=>{if(!iso)return '—';const d=new Date(iso);if(Number.isNaN(d.getTime()))return '—';const now=Date.now();const diff=Math.floor((now-d.getTime())/1000);if(diff<60)return diff+'s önce';if(diff<3600)return Math.floor(diff/60)+'d önce';if(diff<86400)return Math.floor(diff/3600)+'sa önce';return d.toLocaleDateString('tr-TR',{month:'short',day:'numeric'});};

async function api(path,opts={}){
  const key=getKey();
  if(!key)throw new Error('no_key');
  const headers={Authorization:'Bearer '+key,...(opts.headers||{})};
  if(opts.body&&!headers['Content-Type'])headers['Content-Type']='application/json';
  const r=await fetch(path,{...opts,headers});
  if(r.status===401){clearKey();location.replace('/signup.html?reason=auth');throw new Error('auth');}
  if(r.status===204)return null;
  const data=await r.json().catch(()=>({}));
  if(r.status===503&&data?.error?.code==='AUTH_UNAVAILABLE'){
    try{toast('Kimlik doğrulama servisi geçici olarak kullanılamıyor — az sonra tekrar dene','error');}catch(_){}
    throw new Error('auth_unavailable');
  }
  if(!r.ok)throw new Error(data?.error?.message||'HTTP '+r.status);
  return data;
}

let toastTimer=null;
function toast(msg,type='info',action){
  const el=$('#toast');
  el.className='toast '+type+' show';
  if(action&&action.label){
    el.innerHTML='';
    const span=document.createElement('span');span.textContent=msg;el.appendChild(span);
    const btn=document.createElement('button');
    btn.textContent=action.label;
    btn.style.cssText='margin-left:12px;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 10px;font:600 11px Archivo;cursor:pointer';
    btn.onclick=()=>{try{action.fn&&action.fn();}catch(e){}el.classList.remove('show');};
    el.appendChild(btn);
  }else{
    el.textContent=msg;
  }
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.classList.remove('show');},action?5200:2800);
}
window.ucToast=toast;

function modal(html,{onClose,onMount}={}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="modal"><div class="modal-card">${html}</div></div>`;
  const overlay=root.firstElementChild;
  const close=()=>{root.innerHTML='';onClose&&onClose();};
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  document.addEventListener('keydown',function ec(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',ec);}});
  if(onMount)onMount(root,close);
  return close;
}

const VIEWS=['overview','models','providers','routing','requests','usage','apikeys','settings','integrations','pricing'];
const POLAR_CHECKOUT_URL='https://buy.polar.sh/polar_cl_KPLbu6b1dABR2LXgvmEu2jeALNSSn5HnuujYD4BudFI';
function buildPolarCheckoutUrl(amountUsd){
  const params=new URLSearchParams();
  const cents=Math.round(amountUsd*100);
  if(Number.isFinite(cents)&&cents>0){params.set('amount',String(cents));params.set('prefilled_amount',String(cents));}
  let email=null;
  try{email=localStorage.getItem('unichanl_email')||localStorage.getItem('unichanl_user_email');}catch(_){}
  if(email)params.set('customer_email',email);
  const q=params.toString();
  return q?`${POLAR_CHECKOUT_URL}?${q}`:POLAR_CHECKOUT_URL;
}

function setActive(name){
  $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));
  VIEWS.forEach(v=>{const el=$('#view-'+v);if(el)el.classList.toggle('hidden',v!==name);});
}

async function showView(name){
  if(!VIEWS.includes(name))name='overview';
  setActive(name);
  $('#main').scrollTop=0;
  try{await LOADERS[name]();}catch(err){
    console.error('view load',name,err);
    if(err.message!=='auth'){
      if(window.ucTrack) ucTrack('request_error',{view:name,reason:(err.message||'').slice(0,80)});
      toast(err.message||'Yükleme başarısız','err',{label:'Tekrar dene',fn:()=>{if(window.ucTrack)ucTrack('request_retry',{view:name});showView(name);}});
    }
  }
}

function navigateTo(name){
  if(location.hash!=='#/'+name){location.hash='#/'+name;}else{showView(name);}
}

window.addEventListener('hashchange',()=>{const n=(location.hash||'').replace(/^#\//,'')||'overview';showView(n);});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav]');
  if(t){
    e.preventDefault();
    if(!window.__ucFirst){window.__ucFirst=1;if(window.ucTrack)ucTrack('first_action',{action:'nav',target:t.dataset.nav});}
    navigateTo(t.dataset.nav);
  }
});

$('#hd-refresh').addEventListener('click',()=>{const n=(location.hash||'').replace(/^#\//,'')||'overview';showView(n);});

const LOADERS={};

function statCard(lbl,val,sub){
  return `<div class="stat"><div class="lbl">${esc(lbl)}</div><div class="val">${esc(val)}</div><div class="sub2">${esc(sub||'')}</div></div>`;

function buildLineChart(daily){
  const W=560,H=180,PAD=8;
  if(!daily||!daily.length){
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
      <line x1="0" y1="45" x2="${W}" y2="45" stroke="#132023"/><line x1="0" y1="90" x2="${W}" y2="90" stroke="#132023"/><line x1="0" y1="135" x2="${W}" y2="135" stroke="#132023"/>
      <text x="${W/2}" y="${H/2+4}" text-anchor="middle" fill="#4C5758" font-family="JetBrains Mono" font-size="11">Henüz veri yok</text>
    </svg>`;
  }
  const points=daily.map(d=>({t:new Date(d.date||d.day).getTime(),v:Number(d.count||d.requests||d.total||0)}));
  const maxV=Math.max(1,...points.map(p=>p.v));
  const step=(W-PAD*2)/Math.max(1,points.length-1);
  const coords=points.map((p,i)=>[PAD+i*step,H-PAD-((p.v/maxV)*(H-PAD*2))]);
  const line=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=line+` L ${(PAD+(points.length-1)*step).toFixed(1)} ${H-PAD} L ${PAD} ${H-PAD} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
    <defs><linearGradient id="ucfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DFFF00" stop-opacity="0.22"/><stop offset="1" stop-color="#DFFF00" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" y1="45" x2="${W}" y2="45" stroke="#132023"/><line x1="0" y1="90" x2="${W}" y2="90" stroke="#132023"/><line x1="0" y1="135" x2="${W}" y2="135" stroke="#132023"/>
    <path d="${area}" fill="url(#ucfill)"/><path d="${line}" fill="none" stroke="#DFFF00" stroke-width="2" stroke-linejoin="round"/>
  </svg>`;
}

function buildBarChart(daily){
  const W=800,H=180,PAD=8;
  if(!daily||!daily.length)return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#4C5758" font-family="JetBrains Mono" font-size="12">Bu dönemde veri yok</text></svg>`;
  const pts=daily.map(d=>({t:d.date||d.day,v:Number(d.count||d.requests||d.total||0)}));
  const maxV=Math.max(1,...pts.map(p=>p.v));
  const bw=(W-PAD*2)/pts.length-3;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
    <line x1="0" y1="45" x2="${W}" y2="45" stroke="#132023"/><line x1="0" y1="90" x2="${W}" y2="90" stroke="#132023"/><line x1="0" y1="135" x2="${W}" y2="135" stroke="#132023"/>
    ${pts.map((p,i)=>{const h=(p.v/maxV)*(H-PAD*2);const x=PAD+i*(bw+3);return `<rect x="${x.toFixed(1)}" y="${(H-PAD-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="#DFFF00" opacity="${p.v?0.85:0.15}" rx="2"/>`;}).join('')}
  </svg>`;
}

  const LOBE_SLUG={anthropic:'claude',openai:'openai',meta:'meta',mistral:'mistral',deepseek:'deepseek',qwen:'qwen',nvidia:'nvidia',google:'gemini',xai:'xai',cohere:'cohere',perplexity:'perplexity',microsoft:'microsoft',moonshot:'moonshot','01ai':'01ai',groq:'groq',ai21:'ai21',stability:'stability',databricks:'databricks',amazon:'amazon',baidu:'baidu',zhipu:'zhipu'};
  function getBrandFromId(modelId){
    const id=String(modelId||'').toLowerCase();
    if(id.includes('claude')||id.startsWith('anthropic/'))return'anthropic';
    if(id.includes('gpt')||id.includes('openai/')||id.includes('/o1')||id.includes('/o3')||id.includes('/o4'))return'openai';
    if(id.includes('grok')||id.startsWith('x-ai/'))return'xai';
    if(id.includes('gemini')||id.includes('gemma')||id.startsWith('google/'))return'google';
    if(id.includes('deepseek'))return'deepseek';
    if(id.includes('qwen'))return'qwen';
    if(id.includes('mistral')||id.includes('mixtral'))return'mistral';
    if(id.includes('nemotron')||id.startsWith('nvidia/'))return'nvidia';
    if(id.includes('llama')||id.startsWith('meta-llama/')||id.startsWith('meta/'))return'meta';
    if(id.includes('cohere')||id.includes('command-'))return'cohere';
    if(id.includes('perplexity')||id.includes('sonar'))return'perplexity';
    if(id.includes('phi-')||id.startsWith('microsoft/'))return'microsoft';
    if(id.includes('kimi')||id.includes('moonshot'))return'moonshot';
    if(id.startsWith('01-ai/')||id.includes('/yi-'))return'01ai';
    if(id.startsWith('groq/'))return'groq';
    if(id.startsWith('ai21/')||id.includes('jamba'))return'ai21';
    if(id.startsWith('stabilityai/')||id.includes('stable-'))return'stability';
    if(id.startsWith('databricks/')||id.includes('dbrx'))return'databricks';
    if(id.includes('nova-')||id.startsWith('amazon/'))return'amazon';
    if(id.includes('ernie')||id.startsWith('baidu/'))return'baidu';
    if(id.includes('glm-')||id.startsWith('zhipu/')||id.startsWith('thudm/'))return'zhipu';
    return null;
  }
  function getLogo(brand,modelId){
    const b=brand&&brand!=='other'?brand:getBrandFromId(modelId);
    if(!b)return{primary:'',fallback:''};
    const slug=LOBE_SLUG[b]||b;
    return{primary:`${LOBE}/${slug}.png`,fallback:FAV[b]||''};
  }
  function placeholderSvg(modelId){
    const label=String(modelId||'?').replace(/^.+\//,'').charAt(0).toUpperCase();
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><rect width="28" height="28" rx="6" fill="#132023"/><text x="14" y="19" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="14" font-weight="600" fill="#657172">${label}</text></svg>`;
    return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
  }
  function logoImg(brand,modelId,size){
    const {primary,fallback}=getLogo(brand,modelId);
    const s=size||24;
    const ph=placeholderSvg(modelId);
    if(!primary)return `<img src="${ph}" alt="" width="${s}" height="${s}" style="width:${s}px;height:${s}px;border-radius:6px;object-fit:contain">`;
    return `<img src="${esc(primary)}" alt="Logo" width="${s}" height="${s}" style="width:${s}px;height:${s}px;border-radius:6px;background:#0F1A1B;padding:3px;object-fit:contain" loading="lazy" data-fb="${esc(fallback)}" data-ph="${esc(ph)}" onerror="var s=this.dataset.step||'0';if(s==='0'&&this.dataset.fb){this.dataset.step='1';this.src=this.dataset.fb;}else{this.dataset.step='2';this.src=this.dataset.ph;this.onerror=null;}">`;
  }
  const el=$('#view-models');
  const state={creator:'',tag:'',search:''};
  el.innerHTML=`
    <div style="max-width:1180px;margin:0 auto">
      <div class="crumb">UNICHANL / KATALOG</div>
      <h1 class="h1">Modeller</h1>
      <p class="sub">Sistemdeki tüm modeller. Fiyatlar 1K token başınadır ve katalog upstream'den saatlik senkronize edilir.</p>
      <div id="models-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px"></div>
      <div id="models-filters" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
        <input id="mf-search" class="inp" placeholder="Model ara (llama, claude, gpt…)" style="flex:1;min-width:220px;max-width:360px">
        <select id="mf-creator" class="inp" style="width:auto;min-width:180px">
          <option value="">Tüm markalar</option>
        </select>
        <div id="mf-tags" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="card" style="overflow:hidden">
        <div id="models-body"><div class="empty">Yükleniyor…</div></div>
      </div>
    </div>`;

  const TAGS=['code','reasoning','vision','fast','cheap','free','long-context'];
  const tagsEl=$('#mf-tags');
  tagsEl.innerHTML=TAGS.map(t=>`<button type="button" class="pill mut" data-tag="${t}" style="cursor:pointer;background:transparent;border:1px solid #1C2A2D">${t}</button>`).join('');

  const statsEl=$('#models-stats');
  const body=$('#models-body');
  let allModels=[];
  let totalCount=0;
  let creatorCount=0;
  let loadError=false;

  async function fetchPage(page,limit){
    const params=new URLSearchParams();
    if(state.tag)params.set('tag',state.tag);
    if(state.search)params.set('search',state.search);
    params.set('page',String(page));
    params.set('limit',String(limit));
    const r=await fetch('/api/public/models?'+params.toString());
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }

  async function fetchAll(){
    const LIMIT=200;
    const first=await fetchPage(1,LIMIT);
    let items=first?.models||[];
    const total=first?.total||0;
    creatorCount=first?.creatorCount||0;
    const pages=Math.ceil(total/LIMIT);
    if(pages>1){
      const rest=await Promise.all(
        Array.from({length:pages-1},(_,i)=>fetchPage(i+2,LIMIT).then(r=>r?.models||[]).catch(()=>[]))
      );
      for(const chunk of rest)items=items.concat(chunk);
    }
    return {items,total};
  }

  try{
    const {items,total}=await fetchAll();
    allModels=items;
    totalCount=total;
  }catch(err){
    loadError=true;
  }

  function renderStats(){
    statsEl.innerHTML=[
      statCard('MEVCUT MODEL',fmtInt(totalCount),'tümü senkronize'),
      statCard('MODEL MARKASI',fmtInt(creatorCount),'benzersiz üretici'),
      statCard('İNDİRİM','-%45','her modelde')
    ].join('');
  }

  function populateCreatorDropdown(){
    const sel=$('#mf-creator');
    const seen=new Map();
    for(const m of allModels){
      const b=m.creatorBrand||'other';
      if(!seen.has(b))seen.set(b,m.creatorDisplayName||b);
    }
    const opts=[...seen.entries()].sort((a,b)=>a[1].localeCompare(b[1]));
    const cur=state.creator;
    sel.innerHTML='<option value="">Tüm markalar</option>'+
      opts.map(([k,v])=>`<option value="${esc(k)}"${k===cur?' selected':''}>${esc(v)}</option>`).join('');
  }

  function filtered(){
    return allModels.filter(m=>{
      if(state.creator && (m.creatorBrand||'other')!==state.creator)return false;
      if(state.tag && !(m.tags||[]).includes(state.tag))return false;
      if(state.search){
        const q=state.search.toLowerCase();
        const a=(m.modelName||'').toLowerCase();
        const b=(m.displayName||'').toLowerCase();
        if(!a.includes(q)&&!b.includes(q))return false;
      }
      return true;
    });
  }

  function priceCell(list,discounted,isFree){
    if(isFree)return `<div class="mono" style="text-align:right"><span style="color:#4ADE80">FREE</span></div>`;
    return `<div style="text-align:right;line-height:1.2">
      <div class="mono" style="font-size:11px;color:#657172;text-decoration:line-through">${fmtUsd(list)}</div>
      <div class="mono" style="font-size:13px;color:#F2F5F4;font-weight:600">${fmtUsd(discounted)}</div>
    </div>`;
  }

  function updateBody(){
    if(loadError){body.innerHTML='<div class="empty">Katalog yüklenemedi, birazdan tekrar dene.</div>';return;}
    if(!allModels.length){body.innerHTML='<div class="empty">Henüz model yok.</div>';return;}
    const rows=filtered();
    if(!rows.length){body.innerHTML='<div class="empty">Filtreye uyan model yok.</div>';return;}
    body.innerHTML=`
      <div style="padding:1.1rem 1.25rem 0.75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
        <div>
          <h2 style="margin:0;color:#F2F5F4;font-size:1.15rem;font-weight:600;letter-spacing:-0.01em">Katalog</h2>
          <p style="margin:0.25rem 0 0 0;color:#657172;font-size:0.82rem">Üstü çizili fiyat = pazar liste fiyatı. Kalın fiyat = %45 indirimli fiyatınız.</p>
        </div>
        <span class="mono" style="font-size:0.75rem;color:#657172">${fmtInt(rows.length)} / ${fmtInt(totalCount)} model</span>
      </div>
      <table class="tbl">
      <thead><tr>
        <th>MODEL</th>
        <th>İNDİRİM</th>
        <th style="text-align:right">GİRDİ /1K</th>
        <th style="text-align:right">ÇIKTI /1K</th>
        <th style="text-align:right">CONTEXT</th>
        <th>MARKA</th>
      </tr></thead>
      <tbody>${rows.map(m=>{
        const modelIdent=m.modelName||m.id;
        const brand=m.creatorBrand||'other';
        const logoHtml=logoImg(brand,modelIdent,28);
        const discountPill=m.isFree
          ?''
          :`<span class="pill" style="background:rgba(239,68,68,.12);color:#F87171;border:1px solid rgba(239,68,68,.28)">-${m.discountPercent||45}%</span>`;
        return `<tr>
          <td><div style="display:flex;align-items:center;gap:0.75rem">
            ${logoHtml}
            <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
              <span style="color:#F2F5F4;font-weight:600">${esc(m.displayName||modelIdent)}</span>
              <span class="mono" style="font-size:11px;color:#657172">${esc(modelIdent)}</span>
            </div>
          </div></td>
          <td>${discountPill}</td>
          <td>${priceCell(m.listInputPricePer1k||0,m.discountedInputPricePer1k||0,m.isFree)}</td>
          <td>${priceCell(m.listOutputPricePer1k||0,m.discountedOutputPricePer1k||0,m.isFree)}</td>
          <td class="mono" style="text-align:right;color:#98A3A3">${m.contextWindow?fmtInt(m.contextWindow):'—'}</td>
          <td class="mono" style="font-size:12px;color:#C7CFCE">${esc(m.creatorDisplayName||'—')}</td>
        </tr>`;
      }).join('')}</tbody></table>`;
  }

  renderStats();
  populateCreatorDropdown();

  let searchTimer=null;
  $('#mf-search').addEventListener('input',e=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      state.search=e.target.value.trim();
      updateBody();
    },200);
  });
  $('#mf-creator').addEventListener('change',e=>{
    state.creator=e.target.value;
    updateBody();
  });
  tagsEl.addEventListener('click',e=>{
    const btn=e.target.closest('[data-tag]');
    if(!btn)return;
    const tag=btn.dataset.tag;
    if(state.tag===tag){state.tag='';btn.classList.remove('ok');btn.classList.add('mut');}
    else{
      state.tag=tag;
      tagsEl.querySelectorAll('[data-tag]').forEach(b=>{b.classList.remove('ok');b.classList.add('mut');});
      btn.classList.remove('mut');btn.classList.add('ok');
    }
    updateBody();
  });

  updateBody();
};

}

function openRuleWizard(){
  const state={step:1,guide:false,name:'',description:'',strategy:'lowest_cost',priority:10,enabled:true,conditions:{modelPrefix:'',minTokens:'',maxTokens:'',userTier:''}};
  const close=modal(ruleWizardHtml(state),{onMount:(root,closeFn)=>{bindRuleWizard(root,state,closeFn);}});
}

function ruleWizardHtml(s){
  const pct=Math.round((s.step/4)*100);
  return `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <div style="width:34px;height:34px;border-radius:9px;background:rgba(223,255,0,.12);border:1px solid rgba(223,255,0,.35);display:grid;place-items:center;color:#DFFF00">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
      </div>
      <div style="flex:1">
        <div style="font:600 10px 'JetBrains Mono';color:#DFFF00;letter-spacing:.14em;text-transform:uppercase">Sihirbaz · Adım ${s.step}/4</div>
        <h3 style="font-family:'Newsreader',serif;font-weight:400;font-size:22px;margin:2px 0 0">Yeni Yönlendirme Kuralı</h3>
      </div>
      <button id="rw-guide-toggle" class="link" title="Kılavuz görünümü" style="color:${s.guide?'#DFFF00':'#98A3A3'};font:600 11px 'JetBrains Mono';letter-spacing:.1em">${s.guide?'KILAVUZ ✓':'KILAVUZ'}</button>
    </div>
    <div style="height:4px;background:#1C2A2D;border-radius:99px;overflow:hidden;margin:14px 0 18px"><div style="width:${pct}%;height:100%;background:#DFFF00;transition:width .2s"></div></div>
    <div id="rw-body">${ruleWizardStep(s)}</div>
    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid #132023">
      <button id="rw-cancel" class="btn ghost">İptal</button>
      <div style="display:flex;gap:8px">
        ${s.step>1?'<button id="rw-back" class="btn ghost">Geri</button>':''}
        ${s.step<4?'<button id="rw-next" class="btn">İleri</button>':'<button id="rw-submit" class="btn">Kuralı Oluştur</button>'}
      </div>
    </div>`;
}

function ruleWizardStep(s){
  const guide=s.guide;
  if(s.step===1){
    return `
      ${guide?guideBox('Kurala tanımlayıcı bir isim ver. Örn: "Ucuz kısa mesajlar" veya "Yedek Claude". Açıklama opsiyoneldir ama ekipçe kullanacaksan faydalıdır.'):''}
      <label style="display:block;font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:6px;text-transform:uppercase">Ad</label>
      <input id="rw-name" class="inp" value="${esc(s.name)}" placeholder="Örn: Düşük maliyet kuralı" maxlength="80">
      <label style="display:block;font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin:14px 0 6px;text-transform:uppercase">Açıklama (opsiyonel)</label>
      <textarea id="rw-desc" class="inp" rows="3" placeholder="Ne zaman devreye giriyor?" maxlength="500">${esc(s.description)}</textarea>`;
  }
  if(s.step===2){
    return `
      ${guide?guideBox('Strateji, kural devreye girdiğinde hangi modelin seçileceğini belirler. Maliyet için "en düşük maliyet", kritik iş için "en yüksek kalite" veya "yedekli devir" tercih et.'):''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${RULE_STRATEGIES.map(x=>`
          <label class="rw-strat ${s.strategy===x.key?'sel':''}" data-k="${x.key}" style="border:1px solid ${s.strategy===x.key?'rgba(223,255,0,.5)':'#1C2A2D'};background:${s.strategy===x.key?'rgba(223,255,0,.06)':'#03090B'};border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .12s">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
              <span style="width:14px;height:14px;border-radius:50%;border:2px solid ${s.strategy===x.key?'#DFFF00':'#4C5758'};display:inline-flex;align-items:center;justify-content:center">${s.strategy===x.key?'<span style="width:6px;height:6px;border-radius:50%;background:#DFFF00"></span>':''}</span>
              <span style="font-weight:600;font-size:13.5px;color:#F2F5F4">${x.title}</span>
            </div>
            <div style="font-size:12px;color:#98A3A3;line-height:1.4;padding-left:24px">${x.hint}</div>
          </label>`).join('')}
      </div>`;
  }
  if(s.step===3){
    const c=s.conditions;

function summarizeConditions(c){
  const parts=[];
  if(c.modelPrefix)parts.push('model öneki: '+c.modelPrefix);
  if(c.userTier)parts.push('plan: '+c.userTier);
  if(c.minTokens)parts.push('min token: '+c.minTokens);
  if(c.maxTokens)parts.push('max token: '+c.maxTokens);
  return parts.length?`<div>Koşullar: <span class="mono" style="color:#98A3A3">${esc(parts.join(', '))}</span></div>`:'<div style="color:#657172">Koşul: yok (tüm istekler)</div>';
}

function bindRuleWizard(root,s,closeFn){
  const rerender=()=>{
    const card=root.querySelector('.modal-card');
    card.innerHTML='';
    card.insertAdjacentHTML('afterbegin',ruleWizardHtml(s));
    bindRuleWizard(root,s,closeFn);
  };
  const readStep=()=>{
    if(s.step===1){
      const n=root.querySelector('#rw-name');if(n)s.name=n.value.trim();
      const d=root.querySelector('#rw-desc');if(d)s.description=d.value.trim();
    }else if(s.step===3){
      s.conditions={
        modelPrefix:(root.querySelector('#rw-modelprefix')||{}).value?.trim()||'',
        userTier:(root.querySelector('#rw-tier')||{}).value||'',
        minTokens:(root.querySelector('#rw-mintok')||{}).value||'',
        maxTokens:(root.querySelector('#rw-maxtok')||{}).value||''
      };
    }else if(s.step===4){
      const p=parseInt((root.querySelector('#rw-priority')||{}).value,10);
      if(Number.isFinite(p))s.priority=Math.min(100,Math.max(1,p));
    }
  };
  const cancel=root.querySelector('#rw-cancel');if(cancel)cancel.onclick=closeFn;
  const back=root.querySelector('#rw-back');if(back)back.onclick=()=>{readStep();s.step=Math.max(1,s.step-1);rerender();};
  const next=root.querySelector('#rw-next');
  if(next)next.onclick=()=>{
    readStep();
    if(s.step===1&&s.name.length<2){toast('Ad en az 2 karakter olmalı','err');return;}
    s.step=Math.min(4,s.step+1);rerender();
  };
  const submit=root.querySelector('#rw-submit');
  if(submit)submit.onclick=async()=>{
    readStep();
    if(!s.name||s.name.length<2){toast('Ad en az 2 karakter olmalı','err');return;}
    submit.disabled=true;
    try{
      const conditions={};
      if(s.conditions.modelPrefix)conditions.modelPrefix=s.conditions.modelPrefix;
      if(s.conditions.userTier)conditions.userTier=s.conditions.userTier;
      if(s.conditions.minTokens)conditions.minTokens=parseInt(s.conditions.minTokens,10);
      if(s.conditions.maxTokens)conditions.maxTokens=parseInt(s.conditions.maxTokens,10);
      await api('/api/rules',{method:'POST',body:JSON.stringify({
        name:s.name,
        description:s.description||undefined,
        strategy:s.strategy,
        conditions,
        priority:s.priority,
        enabled:s.enabled
      })});
      toast('Kural oluşturuldu','ok');
      closeFn();
      await renderRulesTable();
    }catch(err){
      toast(err.message||'Kural oluşturulamadı','err');
      submit.disabled=false;
    }
  };
  const guide=root.querySelector('#rw-guide-toggle');if(guide)guide.onclick=()=>{readStep();s.guide=!s.guide;rerender();};
  root.querySelectorAll('.rw-strat').forEach(el=>el.onclick=()=>{s.strategy=el.dataset.k;rerender();});
  const tog=root.querySelector('#rw-toggle');
  if(tog)tog.onclick=()=>{s.enabled=!s.enabled;const lbl=root.querySelector('#rw-toggle-lbl');tog.classList.toggle('on',s.enabled);if(lbl){lbl.textContent=s.enabled?'Aktif':'Pasif';lbl.style.color=s.enabled?'#DFFF00':'#657172';}};
}

async function refreshKeys(){
  const data=await api('/api/keys');
  const keys=data?.keys||[];
  window.__unichanl=window.__unichanl||{};window.__unichanl.keys=keys;
  const b=$('#keys-body');
  if(!keys.length){b.innerHTML='<div class="empty">Henüz anahtar yok.</div>';return;}
  b.innerHTML=`<table class="tbl">
    <thead><tr><th>AD</th><th>ÖN EK</th><th>OLUŞTURMA</th><th style="text-align:right">İSTEK</th><th>SON KULLANIM</th><th></th></tr></thead>
    <tbody>${keys.map(k=>`<tr>
      <td><span style="color:#F2F5F4;font-weight:600">${esc(k.name||'—')}</span></td>
      <td class="mono" style="font-size:12px;color:#DFFF00">${esc(k.keyPrefix||'—')}…</td>

    </tr>`).join('')}</tbody></table>`;
  $$('[data-revoke]',b).forEach(btn=>btn.addEventListener('click',async(e)=>{

  $('#btn-logout').addEventListener('click',()=>{
    if(!confirm('Çıkış yapmak istediğine emin misin?'))return;
    clearKey();try{localStorage.removeItem('unichanl_email');}catch(_){}
    location.replace('/signup.html');
  });
};

LOADERS.pricing=async function(){
  const el=$('#view-pricing');
  el.innerHTML=`
    <div style="max-width:1180px;margin:0 auto">
      <div class="crumb">UNICHANL / FATURA</div>

          <div class="row-split" style="margin-bottom:6px"><div style="font-weight:600;font-size:14px">Otomatik Yenileme</div><button class="togg" id="ar-tog"></button></div>
          <p style="color:#98A3A3;font-size:12.5px;margin:0 0 12px;line-height:1.5">Bakiye eşiğin altına düşerse, sistem tanımlı tutarda otomatik yükleme başlatılır (checkout linki e-posta ile gönderilir).</p>

              <div style="position:relative"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#657172;font-family:'JetBrains Mono'">$</span><input id="ar-threshold" class="inp" type="number" min="0.5" max="1000" step="0.5" style="padding-left:22px"></div>
            </label>
            <label style="display:flex;flex-direction:column;gap:4px">
              <span style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em">YÜKLENECEK ($)</span>
              <div style="position:relative"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#657172;font-family:'JetBrains Mono'">$</span><input id="ar-amount" class="inp" type="number" min="5" max="1000" step="1" style="padding-left:22px"></div>
            </label>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div class="mono" id="ar-info" style="font-size:11.5px;color:#657172">yükleniyor…</div>
            <button class="btn" id="ar-save" style="padding:8px 14px;font-size:12px">Kaydet</button>
          </div>
        </div>
      </div>

      <div class="card" style="padding:24px 26px;margin-bottom:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:6px">Bakiye Yükle</div>
        <p style="color:#98A3A3;font-size:13px;margin:0 0 16px">Ödeme Polar üzerinden güvenle işlenir. Yüklenen tutar direkt cüzdanına eklenir (min $5).</p>
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          <button class="chip topup-preset" data-amt="5">$5</button>
          <button class="chip topup-preset" data-amt="25">$25</button>
          <button class="chip topup-preset" data-amt="100">$100</button>

        <div style="display:flex;gap:10px;align-items:center;max-width:420px">
          <div style="position:relative;flex:1"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#657172;font-family:'JetBrains Mono'">$</span><input id="topup-amt" class="inp" type="number" min="5" step="1" value="5" style="padding-left:24px"></div>

        </div>
      </div>

    if(amt>1000){toast('Maksimum $1000','err');return;}

    if(window.ucTrack) ucTrack('payment_start',{amount:amt,currency:'USD'});
    location.href=buildPolarCheckoutUrl(amt);
  });

    const on=!tog.classList.contains('on');

    catch(err){tog.classList.toggle('on',!on);toast(err.message||'Güncellenemedi','err');}
  });
  $('#ar-save').addEventListener('click',async()=>{
    const th=parseFloat($('#ar-threshold').value);
    const am=parseFloat($('#ar-amount').value);
    if(!Number.isFinite(th)||th<=0||th>1000){toast('Eşik 0-1000 arası olmalı','err');return;}

    }catch(err){toast(err.message||'Kaydedilemedi','err');}
    finally{btn.disabled=false;}
  });
};

async function refreshPricing(){
  const [bal,rc,sub]=await Promise.all([
    api('/api/billing/balance').catch(()=>null),
    api('/api/billing/recharge-settings').catch(()=>null),
    api('/api/billing/subscription').catch(()=>null),
  ]);
  $('#bal-val').textContent=fmtUsd(bal?.balanceUsd||0);
  $('#bal-sub').textContent=bal?'kullanıma hazır':'—';
  if(rc){
    $('#ar-tog').classList.toggle('on',!!rc.autoRechargeEnabled);
    $('#ar-info').textContent='Eşik: $'+rc.autoRechargeThreshold+' · Yüklenecek: $'+rc.autoRechargeAmount;
    const thEl=$('#ar-threshold');if(thEl&&!thEl.value)thEl.value=parseFloat(rc.autoRechargeThreshold).toFixed(2);
    const amEl=$('#ar-amount');if(amEl&&!amEl.value)amEl.value=parseFloat(rc.autoRechargeAmount).toFixed(2);
  }
  const tx=$('#tx-body');
  const txs=bal?.recentTransactions||[];
  if(!txs.length){tx.innerHTML='<div class="empty" style="padding:20px 0">Henüz işlem yok.</div>';}
  else{
    tx.innerHTML=`<table class="tbl"><thead><tr><th>TARİH</th><th>TÜR</th><th style="text-align:right">TUTAR</th><th style="text-align:right">BAKİYE</th></tr></thead><tbody>${txs.map(t=>{
      const amt=parseFloat(t.amountUsd);const sign=amt>=0?'+':'-';const col=amt>=0?'#4ADE80':'#F87171';
      return `<tr><td class="mono" style="font-size:12px;color:#98A3A3">${esc(fmtDate(t.createdAt))}</td>
        <td class="mono" style="font-size:12px;color:#C7CFCE">${esc(t.type)}</td>
        <td class="mono" style="text-align:right;color:${col}">${sign}${fmtUsd(Math.abs(amt))}</td>
        <td class="mono" style="text-align:right;color:#98A3A3">${fmtUsd(t.balanceAfter)}</td></tr>`;
    }).join('')}</tbody></table>`;
  }
  const sb=$('#sub-body');
  if(!sub?.subscription){sb.innerHTML='<div style="color:#98A3A3;font-size:13px">Aktif bir abonelik yok. Sadece kredi bazlı kullanım aktif.</div>';}
  else{
    const s=sub.subscription;
    sb.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
      <div><div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:4px">SEVİYE</div><div style="color:#F2F5F4;font-weight:600">${esc(s.tier)}</div></div>
      <div><div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:4px">DURUM</div><div>${s.status==='active'?'<span class="pill ok">Aktif</span>':'<span class="pill warn">'+esc(s.status)+'</span>'}</div></div>
      <div><div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:4px">DÖNEM BİTİŞ</div><div class="mono" style="font-size:12px;color:#C7CFCE">${esc(fmtDate(s.currentPeriodEnd))}</div></div>
    </div>`;
  }
}

/* ---------- BOOT ---------- */
(async function boot(){
  try{
    const email=localStorage.getItem('unichanl_email');
    if(email){
      $('#profile-name').textContent=email.split('@')[0];
      $('#profile-avatar').textContent=(email[0]||'U').toUpperCase();
      window.__unichanl=window.__unichanl||{};window.__unichanl.user={email};
    }
  }catch(_){}
  const start=(location.hash||'').replace(/^#\//,'')||'overview';
  await showView(start);
  try{document.getElementById('uc-skel')&&document.getElementById('uc-skel').remove();}catch(_){}
  if(window.ucTrack) ucTrack('dashboard_view',{view:start});
  if(location.search.indexOf('checkout=success')>-1 && window.ucTrack) ucTrack('payment_success',{});
})();
</script>
