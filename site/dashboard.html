*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{background:#03090B;color:#F2F5F4;font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.nav-btn{position:relative;display:flex;align-items:center;gap:11px;padding:9px 11px;border:none;border-radius:8px;cursor:pointer;text-align:left;font:500 13.5px 'Archivo',sans-serif;background:transparent;color:#98A3A3;width:100%;transition:background .12s,color .12s}

.hd-btn{width:38px;height:38px;border-radius:9px;background:transparent;border:1px solid #1C2A2D;color:#98A3A3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}

.card{background:#071114;border:1px solid #1C2A2D;border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:99px;font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.04em}

.pill.warn{background:rgba(255,214,107,.12);color:#FFD66B;border:1px solid rgba(255,214,107,.28)}
.pill.err{background:rgba(248,113,113,.12);color:#F87171;border:1px solid rgba(248,113,113,.28)}

.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;background:#DFFF00;border:none;color:#03090B;font:600 13px 'Archivo',sans-serif;cursor:pointer;transition:filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.08)}

.btn.ghost{background:transparent;color:#F2F5F4;border:1px solid #1C2A2D}

.btn.danger{background:transparent;color:#F87171;border:1px solid rgba(248,113,113,.35);height:32px;padding:0 12px;font-size:12px}

.switch span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#657172;transition:all .12s}
.switch input:checked+span{background:rgba(223,255,0,.25)}

.togg{position:relative;display:inline-flex;align-items:center;width:38px;height:22px;background:#1C2A2D;border-radius:99px;cursor:pointer;transition:background .12s;border:none;padding:0}

.togg.on::after{background:#DFFF00;left:18px}

  [style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:1fr 1fr !important}

  .tbl{min-width:640px}

  #hd-newkey{padding:0 12px !important;font-size:12px !important}
  .stat{padding:16px}
  .stat .val{font-size:22px}
  [role="status"]{font-size:8.5px !important;letter-spacing:.06em !important;padding:0 8px;text-align:center;line-height:1.15;gap:6px !important}

  aside[style*="width:250px"]{top:82px;height:calc(100vh - 82px) !important;width:82vw !important;max-width:300px !important}

@media (max-width:380px){
  #hd-newkey svg{display:none}
}
</style>

<script type="module">
const KEY_STORAGE='unichanl_key';
const getKey=()=>localStorage.getItem(KEY_STORAGE);
const clearKey=()=>localStorage.removeItem(KEY_STORAGE);

if(!getKey()){location.replace('/signup.html');}
else if(localStorage.getItem('unichanl.onboarding.pending')==='1'){location.replace('/onboarding.html');}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUsd=v=>{const n=typeof v==='number'?v:parseFloat(v);if(!Number.isFinite(n))return '$0.00';return '$'+n.toFixed(n>=100?2:(n>=1?4:6));};
const fmtInt=v=>{const n=typeof v==='number'?v:parseInt(v,10);if(!Number.isFinite(n))return '0';return n.toLocaleString('tr-TR');};
const fmtDate=iso=>{if(!iso)return '—';const d=new Date(iso);return Number.isNaN(d.getTime())?'—':d.toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:'short'});};
const fmtTimeShort=iso=>{if(!iso)return '—';const d=new Date(iso);if(Number.isNaN(d.getTime()))return '—';const now=Date.now();const diff=Math.floor((now-d.getTime())/1000);if(diff<60)return diff+'s önce';if(diff<3600)return Math.floor(diff/60)+'d önce';if(diff<86400)return Math.floor(diff/3600)+'sa önce';return d.toLocaleDateString('tr-TR',{month:'short',day:'numeric'});};

async function api(path,opts={}){
  const key=getKey();
  if(!key)throw new Error('no_key');
  const headers={Authorization:'Bearer '+key,...(opts.headers||{})};
  if(opts.body&&!headers['Content-Type'])headers['Content-Type']='application/json';
  const r=await fetch(path,{...opts,headers});
  if(r.status===401){clearKey();location.replace('/signup.html?reason=auth');throw new Error('auth');}
  if(r.status===204)return null;
  const data=await r.json().catch(()=>({}));
  if(r.status===503&&data?.error?.code==='AUTH_UNAVAILABLE'){
    try{toast('Kimlik doğrulama servisi geçici olarak kullanılamıyor — az sonra tekrar dene','error');}catch(_){}
    throw new Error('auth_unavailable');
  }
  if(!r.ok)throw new Error(data?.error?.message||'HTTP '+r.status);
  return data;
}

/* ---------- Short-TTL API cache ---------- */
const _apiCache=new Map(); // path -> {t, data, inflight}
function apiCached(path,ttlMs=30000){
  const now=Date.now();
  const hit=_apiCache.get(path);
  if(hit){
    if(hit.inflight)return hit.inflight;
    if(now-hit.t<ttlMs)return Promise.resolve(hit.data);
  }
  const p=api(path).then(d=>{_apiCache.set(path,{t:Date.now(),data:d,inflight:null});return d;})
    .catch(e=>{const cur=_apiCache.get(path);if(cur)cur.inflight=null;throw e;});
  _apiCache.set(path,{t:hit?hit.t:0,data:hit?hit.data:null,inflight:p});
  return p;
}
apiCached.invalidate=function(prefix){
  for(const k of Array.from(_apiCache.keys())){if(k===prefix||k.startsWith(prefix))_apiCache.delete(k);}
};
apiCached.set=function(path,data){_apiCache.set(path,{t:Date.now(),data,inflight:null});};

let toastTimer=null;
function toast(msg,type='info',action){
  const el=$('#toast');
  el.className='toast '+type+' show';
  if(action&&action.label){
    el.innerHTML='';
    const span=document.createElement('span');span.textContent=msg;el.appendChild(span);
    const btn=document.createElement('button');
    btn.textContent=action.label;
    btn.style.cssText='margin-left:12px;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 10px;font:600 11px Archivo;cursor:pointer';
    btn.onclick=()=>{try{action.fn&&action.fn();}catch(e){}el.classList.remove('show');};
    el.appendChild(btn);
  }else{
    el.textContent=msg;
  }
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.classList.remove('show');},action?5200:2800);
}
window.ucToast=toast;

function modal(html,{onClose,onMount}={}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="modal"><div class="modal-card">${html}</div></div>`;
  const overlay=root.firstElementChild;
  const close=()=>{root.innerHTML='';onClose&&onClose();};
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  document.addEventListener('keydown',function ec(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',ec);}});
  if(onMount)onMount(root,close);
  return close;
}

function buildPolarCheckoutUrl(amountUsd){
  const params=new URLSearchParams();
  const cents=Math.round(amountUsd*100);
  if(Number.isFinite(cents)&&cents>0){params.set('amount',String(cents));params.set('prefilled_amount',String(cents));}
  let email=null;
  try{email=localStorage.getItem('unichanl_email')||localStorage.getItem('unichanl_user_email');}catch(_){}
  if(email)params.set('customer_email',email);
  const q=params.toString();
  return q?`${POLAR_CHECKOUT_URL}?${q}`:POLAR_CHECKOUT_URL;
}

function statCard(lbl,val,sub){

function buildLineChart(daily){
  const W=560,H=180,PAD=8;
  if(!daily||!daily.length){
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
      <line x1="0" y1="45" x2="${W}" y2="45" stroke="#132023"/><line x1="0" y1="90" x2="${W}" y2="90" stroke="#132023"/><line x1="0" y1="135" x2="${W}" y2="135" stroke="#132023"/>
      <text x="${W/2}" y="${H/2+4}" text-anchor="middle" fill="#4C5758" font-family="JetBrains Mono" font-size="11">Henüz veri yok</text>
    </svg>`;
  }
  const points=daily.map(d=>({t:new Date(d.date||d.day).getTime(),v:Number(d.count||d.requests||d.total||0)}));
  const maxV=Math.max(1,...points.map(p=>p.v));
  const step=(W-PAD*2)/Math.max(1,points.length-1);
  const coords=points.map((p,i)=>[PAD+i*step,H-PAD-((p.v/maxV)*(H-PAD*2))]);
  const line=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=line+` L ${(PAD+(points.length-1)*step).toFixed(1)} ${H-PAD} L ${PAD} ${H-PAD} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
    <defs><linearGradient id="ucfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DFFF00" stop-opacity="0.22"/><stop offset="1" stop-color="#DFFF00" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" y1="45" x2="${W}" y2="45" stroke="#132023"/><line x1="0" y1="90" x2="${W}" y2="90" stroke="#132023"/><line x1="0" y1="135" x2="${W}" y2="135" stroke="#132023"/>
    <path d="${area}" fill="url(#ucfill)"/><path d="${line}" fill="none" stroke="#DFFF00" stroke-width="2" stroke-linejoin="round"/>
  </svg>`;
}

function buildBarChart(daily){
  const W=800,H=180,PAD=8;
  if(!daily||!daily.length)return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#4C5758" font-family="JetBrains Mono" font-size="12">Bu dönemde veri yok</text></svg>`;
  const pts=daily.map(d=>({t:d.date||d.day,v:Number(d.count||d.requests||d.total||0)}));
  const maxV=Math.max(1,...pts.map(p=>p.v));
  const bw=(W-PAD*2)/pts.length-3;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px;display:block">
    <line x1="0" y1="45" x2="${W}" y2="45" stroke="#132023"/><line x1="0" y1="90" x2="${W}" y2="90" stroke="#132023"/><line x1="0" y1="135" x2="${W}" y2="135" stroke="#132023"/>
    ${pts.map((p,i)=>{const h=(p.v/maxV)*(H-PAD*2);const x=PAD+i*(bw+3);return `<rect x="${x.toFixed(1)}" y="${(H-PAD-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="#DFFF00" opacity="${p.v?0.85:0.15}" rx="2"/>`;}).join('')}
  </svg>`;
}

        <div id="ov-recent"></div>
      </div>
    </div>`;

  // Critical wave: usage + balance in parallel; render stats + credits pill ASAP.
  // Onboarding status is fetched separately (deferred) by _onboarding.js.
  const [usage,bal]=await Promise.all([
    api('/api/usage?limit=20').catch(()=>null),
    apiCached('/api/billing/balance',30000).catch(()=>null),
  ]);

  const stats=$('#ov-stats');
  const totalReq=usage?.summary?.totalRequests||0;
  const totalTok=usage?.summary?.totalTokens||0;
  const recent=usage?.recent||[];
  const successCount=recent.filter(r=>!r.errorCode).length;
  const successPct=recent.length?Math.round((successCount/recent.length)*1000)/10:null;
  const avgLat=usage?.analytics?.avgLatency||0;
  const balance=bal?.balanceUsd||'0';
  window.updateCreditsPill(balance);

  stats.innerHTML=[
    statCard('İSTEK',fmtInt(totalReq),totalTok?fmtInt(totalTok)+' token':'son 30 gün'),
    statCard('BAŞARILI',successPct==null?'—':successPct.toFixed(1)+'%',recent.length?recent.length+' son istek':'veri yok'),
    statCard('ORT. GECİKME',avgLat?avgLat+' ms':'—','modeller arası p50'),
    statCard('BAKİYE',fmtUsd(balance),'cüzdan')
  ].join('');
  try{performance.mark&&performance.mark('uc:overview-ready');}catch(_){}

  // Deferred wave: chart, model distribution, recent requests table.
  // These are below the first stat cards and can safely paint one frame later.
  const renderRest=()=>{
    $('#ov-chart').innerHTML=buildLineChart(usage?.analytics?.dailyUsage||[]);

    const dist=$('#ov-dist');
    const byModel=usage?.byModel||[];
    if(!byModel.length){dist.innerHTML='<div class="empty" style="padding:20px 0">Henüz yönlendirme verisi yok.</div>';}
    else{
      const totals=byModel.map(m=>({name:m.modelId||'model',count:m._count?.id||0}));
      const sum=totals.reduce((a,b)=>a+b.count,0)||1;
      const colors=['#DFFF00','#4ADE80','#60A5FA','#F472B6','#FBBF24','#A78BFA'];
      dist.innerHTML=totals.slice(0,6).map((d,i)=>{
        const pct=Math.round((d.count/sum)*100);
        return `<div style="margin-bottom:15px">
          <div class="row-split" style="font-size:12.5px;margin-bottom:6px"><span class="mono" style="color:#C7CFCE;font-size:11.5px">${esc(d.name)}</span><span class="mono" style="color:#657172;font-size:11px">${pct}%</span></div>
          <div style="height:6px;border-radius:4px;background:#0B171A;overflow:hidden"><div style="height:100%;width:${pct}%;background:${colors[i%colors.length]};border-radius:4px"></div></div>
        </div>`;
      }).join('');
    }

    const rec=$('#ov-recent');
    if(!recent.length){rec.innerHTML='<div class="empty">Henüz istek yok. İlk isteğini gönderdiğinde burada görünecek.</div>';}
    else{
      rec.innerHTML=`<div style="display:grid;grid-template-columns:110px 1fr 180px 110px 90px 100px;padding:10px 22px;font:600 10px 'JetBrains Mono';letter-spacing:.1em;color:#4C5758;border-bottom:1px solid #132023">
        <span>ZAMAN</span><span>OTURUM</span><span>MODEL</span><span>DURUM</span><span>GECİKME</span><span style="text-align:right">MALİYET</span>
      </div>`+recent.slice(0,20).map(r=>{
        const status=r.errorCode?'err':'ok';
        const clr=status==='ok'?'#4ADE80':'#F87171';
        const stTxt=status==='ok'?'Başarılı':(r.errorCode||'Hata');
        return `<div style="display:grid;grid-template-columns:110px 1fr 180px 110px 90px 100px;padding:13px 22px;align-items:center;border-bottom:1px solid #0C171A;font-size:13px">
          <span class="mono" style="font-size:11.5px;color:#657172">${esc(fmtTimeShort(r.createdAt))}</span>
          <span style="color:#C7CFCE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px">${esc(r.sessionId||'—')}</span>
          <span class="mono" style="font-size:12px;color:#C7CFCE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.modelId||'—')}</span>
          <span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:${clr}"><span style="width:6px;height:6px;border-radius:50%;background:${clr}"></span>${esc(stTxt)}</span></span>
          <span class="mono" style="font-size:12px;color:#98A3A3">${r.latencyMs?r.latencyMs+' ms':'—'}</span>
          <span class="mono" style="font-size:12px;color:#98A3A3;text-align:right">${fmtUsd(r.costUsd||0)}</span>
        </div>`;
      }).join('');
    }
  };
  const scheduleRest=()=>{
    if('requestIdleCallback' in window){requestIdleCallback(renderRest,{timeout:600});}
    else{setTimeout(renderRest,0);}
  };
  requestAnimationFrame(scheduleRest);

  window.__unichanl=window.__unichanl||{};
  window.dispatchEvent(new Event('unichanl:onboarding'));
};

  renderTagChips();
  populateCreatorDropdown();

  let searchTimer=null;
  $('#mf-search').addEventListener('input',e=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      state.search=e.target.value.trim();
      updateBody();
    },200);
  });
  $('#mf-creator').addEventListener('change',e=>{
    state.creator=e.target.value;
    updateBody();
  });
  tagsEl.addEventListener('click',e=>{
    const btn=e.target.closest('[data-tag]');
    if(!btn)return;
    const tag=btn.dataset.tag;
    state.tag=(tag!==''&&state.tag===tag)?'':tag;
    renderTagChips();
    updateBody();
  });

  updateBody();
};

const RT_TRIGGERS=['quota_exceeded','timeout','model_unavailable'];
const PREF_TO_STRATEGY={lowestcost:'lowest_cost',premium:'highest_quality',balanced:'weighted_round_robin',fastest:'failover'};
const STRATEGY_TO_PREF={lowest_cost:'lowestcost',highest_quality:'premium',weighted_round_robin:'balanced',failover:'fastest'};
const PREF_META={
  lowestcost:{label:'Düşük maliyet',color:'#7CE7B8'},
  premium:{label:'Premium',color:'#DFFF00'},
  balanced:{label:'Dengeli',color:'#8BB8FF'},

};
const RT_PROVIDERS=[

  ]},
  {key:'google',name:'Google (Gemini)',slug:'gemini',models:[
    {id:'google/gemini-2.5-pro',label:'Gemini 2.5 Pro'},
    {id:'google/gemini-2.5-flash',label:'Gemini 2.5 Flash'}
  ]},
  {key:'deepseek',name:'DeepSeek',slug:'deepseek',models:[
    {id:'deepseek/deepseek-chat',label:'DeepSeek Chat'},

  ]},

    {id:'x-ai/grok-beta',label:'Grok Beta'}
  ]},

    {id:'meta-llama/llama-3.3-70b',label:'Llama 3.3 70B'}
  ]}
];
function rtModelInfo(id){
  for(const p of RT_PROVIDERS){for(const m of p.models){if(m.id===id)return{id:m.id,label:m.label,provider:p};}}
  const s=String(id||'').toLowerCase();
  const p=RT_PROVIDERS.find(x=>s.includes(x.slug)||s.startsWith(x.key+'/'));
  const label=String(id||'').split('/').pop()||id||'—';
  return{id:id||'',label,provider:p||{key:'other',name:(String(id||'').split('/')[0]||'model'),slug:'openrouter'}};
}
function rtLogo(id,size){
  const info=rtModelInfo(id);
  const slug=info.provider.slug||'openrouter';
  const s=size||36;
  const url='https://cdn.jsdelivr.net/npm/@lobehub/icons-static-png@latest/dark/'+slug+'-color.png';
  const fb='https://cdn.jsdelivr.net/npm/@lobehub/icons-static-png@latest/dark/'+slug+'.png';
  return '<img src="'+esc(url)+'" alt="" width="'+s+'" height="'+s+'" style="width:'+s+'px;height:'+s+'px;border-radius:8px;background:#0F1A1B;padding:4px;object-fit:contain" loading="lazy" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=\''+esc(fb)+'\';}else{this.onerror=null;}">';
}
const RULE_PRESETS={
  lowestcost:[
    {primary:'deepseek/deepseek-chat',fallbacks:['google/gemini-2.5-flash','openai/gpt-4o'],why:'DeepSeek → Gemini Flash → GPT-4o. Kısa/orta istekler için maliyet optimizasyonu.'},
    {primary:'google/gemini-2.5-flash',fallbacks:['deepseek/deepseek-chat','openai/gpt-4o'],why:'Flash birinci, DeepSeek yedek. Basit ve hızlı ucuz zincir.'}
  ],
  premium:[
    {primary:'anthropic/claude-opus-4',fallbacks:['openai/gpt-4o','google/gemini-2.5-pro'],why:'Opus → GPT-4o → Gemini Pro. En yüksek kalite havuzu.'},
    {primary:'openai/gpt-4o',fallbacks:['anthropic/claude-opus-4','google/gemini-2.5-pro'],why:'GPT-4o birinci, Opus + Gemini Pro yedek. Klasik premium.'}
  ],
  balanced:[
    {primary:'anthropic/claude-sonnet-4',fallbacks:['openai/gpt-4o','google/gemini-2.5-pro'],why:'Sonnet → GPT-4o → Gemini Pro. Kalite/fiyat dengesi.'},
    {primary:'openai/gpt-4o',fallbacks:['anthropic/claude-sonnet-4','deepseek/deepseek-chat'],why:'GPT-4o birinci, Sonnet + DeepSeek yedek. Karma denge.'}
  ],
  fastest:[
    {primary:'google/gemini-2.5-flash',fallbacks:['anthropic/claude-haiku-4','deepseek/deepseek-chat'],why:'Flash → Haiku → DeepSeek. En düşük latency zinciri.'},
    {primary:'openai/gpt-4o',fallbacks:['google/gemini-2.5-flash','anthropic/claude-haiku-4'],why:'GPT-4o hızlı, Flash + Haiku yedek.'}
  ]
};
function tailorPresets(preference,primary){
  const base=RULE_PRESETS[preference]||RULE_PRESETS.balanced;
  if(!primary)return base;
  const brand=rtModelInfo(primary).provider.key;
  const out=base.map(p=>{
    if(rtModelInfo(p.primary).provider.key===brand)return p;
    return {primary:primary,fallbacks:p.fallbacks.filter(f=>f!==primary).slice(0,2),why:'Seçtiğin '+rtModelInfo(primary).label+' birincil; yedek zincir '+(PREF_META[preference]?.label||'').toLowerCase()+' önceliğine göre uyarlandı.'};
  });
  const seen=new Set();return out.filter(p=>{const k=p.primary+'|'+p.fallbacks.join(',');if(seen.has(k))return false;seen.add(k);return true;});
}

  b.innerHTML='<div class="empty">Yükleniyor…</div>';
  let rules=[];
  try{const data=await api('/api/rules');rules=data?.rules||[];}
  catch(err){b.innerHTML='<div class="empty" style="padding:40px 24px;color:#F87171">Kurallar yüklenemedi: '+esc(err.message||'hata')+'</div>';return;}

  if(!rules.length){
    b.innerHTML=`<div class="card" style="border-style:dashed;border-color:#1C2A2D;padding:56px 24px;text-align:center">
      <div style="width:52px;height:52px;border-radius:14px;background:rgba(223,255,0,.08);border:1px solid rgba(223,255,0,.28);display:grid;place-items:center;margin:0 auto 16px;color:#DFFF00">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg>

      <button id="rule-new-empty" class="btn" style="font-size:14px;padding:12px 22px">+ Yeni Yönlendirme Kuralı Oluştur</button>
    </div>`;
    const b2=$('#rule-new-empty');if(b2)b2.addEventListener('click',()=>openRuleWizard());
    return;
  }

  b.innerHTML='<div class="rules-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px">'+
    rules.map(r=>renderRuleCard(r)).join('')+'</div>';
  b.querySelectorAll('[data-rule-edit]').forEach(el=>el.onclick=()=>{
    const r=rules.find(x=>x.id===el.dataset.ruleEdit);if(r)openRuleWizard(r);

    const id=el.dataset.ruleToggle;const r=rules.find(x=>x.id===id);if(!r)return;
    try{
      await api('/api/rules/'+id,{method:'PUT',body:JSON.stringify({name:r.name,description:r.description||undefined,strategy:r.strategy,conditions:r.conditions||{},priority:r.priority,enabled:!r.enabled})});
      await renderRulesList();
    }catch(err){toast(err.message||'Güncellenemedi','err');}
  });
}

function renderRuleCard(r){
  const cond=(r.conditions&&typeof r.conditions==='object')?r.conditions:{};
  const chain=cond.chain||{primary:'',fallbacks:[]};
  const pref=cond.preference||STRATEGY_TO_PREF[r.strategy]||'balanced';
  const meta=PREF_META[pref]||PREF_META.balanced;
  const on=r.enabled!==false;
  return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${on?'#7CE7B8':'#4C5758'}"></span>
        <span style="font-weight:600;font-size:14px;color:#F2F5F4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name||r.id)}</span>
      </div>
      <span class="pill" style="background:${meta.color}22;color:${meta.color};border:1px solid ${meta.color}55;font-size:10px">${esc(meta.label)}</span>
    </div>
    <div style="background:#050D0F;border:1px solid #132023;border-radius:10px;padding:12px;overflow-x:auto">
      ${renderChainFlow(chain,{mini:true})}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <button data-rule-toggle="${esc(r.id)}" class="link" style="font:600 10px 'JetBrains Mono';letter-spacing:.14em;color:${on?'#DFFF00':'#657172'};background:none;border:none;cursor:pointer;padding:0">${on?'AKTİF':'PASİF'}</button>
      <div style="display:flex;gap:6px">
        <button data-rule-edit="${esc(r.id)}" class="btn ghost" style="height:30px;padding:0 12px;font-size:12px">Düzenle</button>
        <button data-rule-del="${esc(r.id)}" class="btn danger" style="height:30px;padding:0 12px;font-size:12px">Sil</button>
      </div>
    </div>
  </div>`;
}

function renderChainFlow(chain,opts){
  const mini=opts&&opts.mini;
  const items=[chain.primary,...(chain.fallbacks||[])].filter(Boolean);
  if(!items.length)return '<div style="color:#657172;font-size:12px;text-align:center;padding:8px">Zincir tanımlanmadı</div>';
  const size=mini?36:52;
  const rows=items.map((id,i)=>{
    const info=rtModelInfo(id);
    const role=i===0?'PRIMARY':'FALLBACK '+i;
    const roleColor=i===0?'#DFFF00':'#98A3A3';
    return `<div style="display:flex;flex-direction:column;align-items:center;min-width:${size+16}px">
      ${rtLogo(id,size)}
      <div style="font:600 9px 'JetBrains Mono';letter-spacing:.12em;color:${roleColor};margin-top:6px">${role}</div>
      ${mini?'':'<div style="font-size:12px;color:#C7CFCE;margin-top:2px;max-width:140px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(info.label)+'</div>'}
    </div>`;
  });
  const arrow='<div style="display:flex;align-items:center;color:#4C5758;padding:0 6px;margin-top:'+(size/2-6)+'px"><svg width="'+(mini?16:22)+'" height="10" viewBox="0 0 22 10" fill="none"><path d="M0 5h20M14 1l6 4-6 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  return '<div class="chain-flow" style="display:flex;align-items:flex-start;justify-content:flex-start;gap:0">'+rows.join(arrow)+'</div>';
}

function confirmDelete(r){
  if(!r)return;
  const close=modal(`
    <h3 style="font-family:'Newsreader',serif;font-weight:400;font-size:20px;margin:0 0 8px">Kuralı sil</h3>
    <p style="color:#98A3A3;font-size:13px;line-height:1.5;margin:0 0 20px">"<strong style="color:#F2F5F4">${esc(r.name)}</strong>" kalıcı olarak silinecek. Devam edilsin mi?</p>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button id="del-cancel" class="btn ghost">Vazgeç</button>
      <button id="del-ok" class="btn danger">Sil</button>
    </div>`,{onMount:(root,closeFn)=>{
    root.querySelector('#del-cancel').onclick=closeFn;
    root.querySelector('#del-ok').onclick=async()=>{
      try{await api('/api/rules/'+r.id,{method:'DELETE'});toast('Silindi','ok');closeFn();await renderRulesList();}
      catch(err){toast(err.message||'Silinemedi','err');}

}

/* ------- Wizard ------- */
function openRuleWizard(existing){
  const cond=(existing&&existing.conditions&&typeof existing.conditions==='object')?existing.conditions:{};
  const chain=cond.chain||{primary:'',fallbacks:[]};
  const state={
    step:1,
    editingId:existing?existing.id:null,
    name:existing?(existing.name||''):'',
    preference:cond.preference||(existing?STRATEGY_TO_PREF[existing.strategy]:'')||'',
    primary:chain.primary||'',
    fallbackCount:(chain.fallbacks&&chain.fallbacks.length)?chain.fallbacks.length:2,
    chain:{primary:chain.primary||'',fallbacks:(chain.fallbacks||[]).slice(0,2)},
    enabled:existing?existing.enabled!==false:true
  };
  if(existing)state.step=5;
  modal(wizHtml(state),{onMount:(root,closeFn)=>bindWiz(root,state,closeFn)});
}

function wizHtml(s){
  const stepLabel=s.editingId?'Düzenle':('Adım '+Math.min(s.step,3)+'/3');
  return `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <div style="width:34px;height:34px;border-radius:9px;background:rgba(223,255,0,.12);border:1px solid rgba(223,255,0,.35);display:grid;place-items:center;color:#DFFF00">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font:600 10px 'JetBrains Mono';color:#DFFF00;letter-spacing:.14em;text-transform:uppercase">${esc(stepLabel)}</div>
        <h3 style="font-family:'Newsreader',serif;font-weight:400;font-size:22px;margin:2px 0 0">${s.editingId?'Kuralı Düzenle':'Yeni Yönlendirme Kuralı'}</h3>
      </div>
    </div>
    ${s.editingId?'':'<div style="height:4px;background:#1C2A2D;border-radius:99px;overflow:hidden;margin:14px 0 18px"><div style="width:'+Math.min(100,(Math.min(s.step,3)/3)*100)+'%;height:100%;background:#DFFF00;transition:width .2s"></div></div>'}
    <div id="wiz-body">${wizStep(s)}</div>
    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid #132023">
      <button id="wiz-cancel" class="btn ghost">İptal</button>
      <div style="display:flex;gap:8px" id="wiz-actions">${wizActions(s)}</div>
    </div>`;
}

function wizActions(s){
  if(s.editingId||s.step===5)return '<button id="wiz-save" class="btn">Kuralı Kaydet</button>';
  if(s.step===4)return '<button id="wiz-back" class="btn ghost">Geri</button><button id="wiz-custom" class="btn ghost">Kendim oluşturacağım</button>';
  const prev=s.step>1?'<button id="wiz-back" class="btn ghost">Geri</button>':'';
  return prev+'<button id="wiz-next" class="btn">İleri</button>';
}

      </div>
    </label>
    <div style="border:1px solid ${s.primary?'rgba(223,255,0,.5)':'#1C2A2D'};background:${s.primary?'rgba(223,255,0,.06)':'#03090B'};border-radius:10px;padding:14px">

        <span style="font-weight:600;font-size:13.5px;color:#F2F5F4">Evet, şu modeli birincil yap</span>

      <select id="wiz-primary-select" class="inp" style="width:100%">
        <option value="">— seç —</option>

    </div>`;
  }
  if(s.step===3){
    return `<div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:10px;text-transform:uppercase">Kaç yedek model olsun?</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">

  if(s.step===4){
    const presets=tailorPresets(s.preference,s.primary).slice(0,3).map(p=>({primary:p.primary,fallbacks:p.fallbacks.slice(0,s.fallbackCount),why:p.why}));
    return `<p style="color:#98A3A3;font-size:13px;margin:0 0 14px">Cevaplarına göre önerilen zincirler:</p>

  }

function bindWiz(root,s,closeFn){
  const rerender=()=>{
    const card=root.querySelector('.modal-card');
    card.innerHTML='';
    card.insertAdjacentHTML('afterbegin',wizHtml(s));
    bindWiz(root,s,closeFn);
  };
  root.querySelector('#wiz-cancel').onclick=closeFn;
  const back=root.querySelector('#wiz-back');
  if(back)back.onclick=()=>{s.step=Math.max(1,s.step-1);rerender();};
  const next=root.querySelector('#wiz-next');
  if(next)next.onclick=()=>{
    if(s.step===1&&!s.preference){toast('Bir öncelik seç','err');return;}
    if(s.step===2){const sel=root.querySelector('#wiz-primary-select');if(sel)s.primary=sel.value||'';}
    s.step+=1;
    rerender();
  };
  const custom=root.querySelector('#wiz-custom');
  if(custom)custom.onclick=()=>{
    s.chain={primary:s.primary||'',fallbacks:[]};
    s.step=5;
    rerender();
  };
  root.querySelectorAll('.wiz-pref').forEach(el=>el.onclick=()=>{s.preference=el.dataset.k;rerender();});
  root.querySelectorAll('.wiz-fb').forEach(el=>el.onclick=()=>{s.fallbackCount=parseInt(el.dataset.n,10)||1;rerender();});
  const autoBtn=root.querySelector('.wiz-primary-auto');
  if(autoBtn)autoBtn.onclick=()=>{s.primary='';rerender();};
  const sel=root.querySelector('#wiz-primary-select');
  if(sel)sel.onchange=()=>{s.primary=sel.value||'';rerender();};

  root.querySelectorAll('.wiz-preset-use').forEach(el=>el.onclick=(ev)=>{
    ev.stopPropagation();
    const i=parseInt(el.dataset.i,10);
    const presets=tailorPresets(s.preference,s.primary).slice(0,3).map(p=>({primary:p.primary,fallbacks:p.fallbacks.slice(0,s.fallbackCount)}));
    const p=presets[i];if(!p)return;
    s.chain={primary:p.primary,fallbacks:p.fallbacks.slice()};
    s.step=5;
    rerender();
  });

  root.querySelectorAll('.slot-add,.slot-change').forEach(el=>el.onclick=(ev)=>{
    ev.stopPropagation();
    const i=parseInt(el.dataset.i,10);
    openModelPicker(id=>{
      if(i===0)s.chain.primary=id;
      else s.chain.fallbacks[i-1]=id;
      rerender();
    });
  });
  root.querySelectorAll('.slot-clear').forEach(el=>el.onclick=(ev)=>{
    ev.stopPropagation();
    const i=parseInt(el.dataset.i,10);
    if(i===0)s.chain.primary='';
    else s.chain.fallbacks[i-1]='';
    rerender();
  });

  const slots=root.querySelectorAll('.slot[draggable]');
  let dragIdx=null;
  slots.forEach(el=>{
    el.addEventListener('dragstart',()=>{dragIdx=parseInt(el.dataset.i,10);el.style.opacity='0.5';});
    el.addEventListener('dragend',()=>{el.style.opacity='1';});
    el.addEventListener('dragover',e=>{e.preventDefault();el.style.borderColor='#DFFF00';});
    el.addEventListener('dragleave',()=>{el.style.borderColor='';});
    el.addEventListener('drop',e=>{
      e.preventDefault();el.style.borderColor='';
      const dropIdx=parseInt(el.dataset.i,10);
      if(dragIdx==null||dragIdx===dropIdx)return;
      const arr=[s.chain.primary,...s.chain.fallbacks];
      while(arr.length<=Math.max(dragIdx,dropIdx))arr.push('');
      const t=arr[dragIdx];arr[dragIdx]=arr[dropIdx];arr[dropIdx]=t;
      s.chain.primary=arr[0]||'';
      s.chain.fallbacks=arr.slice(1,1+s.fallbackCount);
      dragIdx=null;
      rerender();
    });
  });

  const tog=root.querySelector('#wiz-toggle-enabled');
  if(tog)tog.onclick=()=>{s.enabled=!s.enabled;rerender();};

  const save=root.querySelector('#wiz-save');
  if(save)save.onclick=async()=>{
    const nameInput=root.querySelector('#wiz-name');
    if(nameInput)s.name=nameInput.value.trim();
    if(!s.chain.primary){toast('Birincil model seç','err');return;}
    const preference=s.preference||'balanced';
    const strategy=PREF_TO_STRATEGY[preference]||'weighted_round_robin';
    const fallbacks=s.chain.fallbacks.filter(Boolean).slice(0,2);
    const info=rtModelInfo(s.chain.primary);
    const autoName=((PREF_META[preference]&&PREF_META[preference].label)||'Kural')+' · '+info.label;
    const body={
      name:(s.name&&s.name.length>=2)?s.name:autoName,
      strategy,
      conditions:{chain:{primary:s.chain.primary,fallbacks},triggers:RT_TRIGGERS,preference},
      priority:10,
      enabled:s.enabled
    };
    save.disabled=true;
    try{
      if(s.editingId){
        await api('/api/rules/'+s.editingId,{method:'PUT',body:JSON.stringify(body)});
        toast('Kural güncellendi','ok');
      }else{
        await api('/api/rules',{method:'POST',body:JSON.stringify(body)});
        try{window.UnichanlSetupWizard&&window.UnichanlSetupWizard.markRulesDone();}catch(_){}
        toast('Kural oluşturuldu','ok');
      }
      closeFn();
      await renderRulesList();
    }catch(err){
      toast(err.message||'Kaydedilemedi','err');
      save.disabled=false;
    }
  };
}

function uaSummary(){
  const ua=navigator.userAgent||'';
  let browser='Bilinmeyen tarayıcı';
  if(/Edg\//.test(ua))browser='Edge';
  else if(/Chrome\//.test(ua)&&!/Chromium/.test(ua))browser='Chrome';
  else if(/Firefox\//.test(ua))browser='Firefox';
  else if(/Safari\//.test(ua)&&!/Chrome/.test(ua))browser='Safari';
  let os='';
  if(/Windows NT 10/.test(ua))os='Windows 10/11';
  else if(/Windows/.test(ua))os='Windows';
  else if(/Mac OS X/.test(ua))os='macOS';
  else if(/Android/.test(ua))os='Android';
  else if(/iPhone|iPad/.test(ua))os='iOS';
  else if(/Linux/.test(ua))os='Linux';
  return browser+(os?' · '+os:'');
}

async function doLogout(){
  try{await api('/api/auth/logout',{method:'POST'});}catch(_){}
  clearKey();
  try{localStorage.removeItem('unichanl_email');}catch(_){}
  apiCached.invalidate('/api/user/me');
  location.replace('/signup.html');
}

              <div style="position:relative"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#657172;font-family:'JetBrains Mono'">$</span><input id="ar-threshold" class="inp" type="number" min="0.5" max="1000" step="0.5" style="padding-left:22px"></div>
            </label>
            <label style="display:flex;flex-direction:column;gap:4px">
              <span style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em">YÜKLENECEK ($)</span>
              <div style="position:relative"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#657172;font-family:'JetBrains Mono'">$</span><input id="ar-amount" class="inp" type="number" min="5" max="1000" step="1" style="padding-left:22px"></div>
            </label>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div class="mono" id="ar-info" style="font-size:11.5px;color:#657172">yükleniyor…</div>
            <button class="btn" id="ar-save" style="padding:8px 14px;font-size:12px">Kaydet</button>
          </div>
        </div>
      </div>

      <div class="card" style="padding:24px 26px;margin-bottom:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:6px">Bakiye Yükle</div>
        <p style="color:#98A3A3;font-size:13px;margin:0 0 16px">Ödeme Polar üzerinden güvenle işlenir. Yüklenen tutar direkt cüzdanına eklenir (min $5).</p>
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          <button class="chip topup-preset" data-amt="5">$5</button>
          <button class="chip topup-preset" data-amt="25">$25</button>
          <button class="chip topup-preset" data-amt="100">$100</button>
        </div>
        <div style="display:flex;gap:10px;align-items:center;max-width:420px">
          <div style="position:relative;flex:1"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#657172;font-family:'JetBrains Mono'">$</span><input id="topup-amt" class="inp" type="number" min="5" step="1" value="5" style="padding-left:24px"></div>
          <button class="btn" id="topup-go">Bakiye Yükle</button>
        </div>
      </div>

      <div class="card" style="padding:24px 26px;margin-bottom:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:12px">Son İşlemler</div>
        <div id="tx-body"><div class="empty" style="padding:20px 0">—</div></div>
      </div>

      <div class="card" style="padding:24px 26px">
        <div style="font-weight:600;font-size:14px;margin-bottom:12px">Abonelik</div>
        <div id="sub-body"><div class="empty" style="padding:20px 0">—</div></div>
      </div>
    </div>`;

  await refreshPricing();
  $$('.topup-preset',el).forEach(b=>b.addEventListener('click',()=>{$('#topup-amt').value=b.dataset.amt;}));
  $('#topup-go').addEventListener('click',()=>{
    const amt=parseFloat($('#topup-amt').value);
    if(!Number.isFinite(amt)||amt<5){toast('Minimum $5','err');return;}
    if(amt>1000){toast('Maksimum $1000','err');return;}
    const btn=$('#topup-go');btn.disabled=true;
    if(window.ucTrack) ucTrack('payment_start',{amount:amt,currency:'USD'});
    location.href=buildPolarCheckoutUrl(amt);
  });
  const tog=$('#ar-tog');
  tog.addEventListener('click',async()=>{
    const on=!tog.classList.contains('on');
    tog.classList.toggle('on',on);
    try{await api('/api/billing/recharge-settings',{method:'PUT',body:JSON.stringify({autoRechargeEnabled:on})});apiCached.invalidate('/api/billing/recharge-settings');toast(on?'Otomatik yenileme açık':'Otomatik yenileme kapalı','ok');}
    catch(err){tog.classList.toggle('on',!on);toast(err.message||'Güncellenemedi','err');}
  });
  $('#ar-save').addEventListener('click',async()=>{
    const th=parseFloat($('#ar-threshold').value);
    const am=parseFloat($('#ar-amount').value);
    if(!Number.isFinite(th)||th<=0||th>1000){toast('Eşik 0-1000 arası olmalı','err');return;}
    if(!Number.isFinite(am)||am<5||am>1000){toast('Yüklenecek tutar $5-$1000 arası olmalı','err');return;}
    const btn=$('#ar-save');btn.disabled=true;
    try{
      await api('/api/billing/recharge-settings',{method:'PUT',body:JSON.stringify({autoRechargeThreshold:th,autoRechargeAmount:am})});apiCached.invalidate('/api/billing/recharge-settings');
      $('#ar-info').textContent='Eşik: $'+th.toFixed(2)+' · Yüklenecek: $'+am.toFixed(2);
      toast('Ayarlar kaydedildi','ok');
    }catch(err){toast(err.message||'Kaydedilemedi','err');}
    finally{btn.disabled=false;}
  });
};

async function refreshPricing(){
  const [bal,rc,sub]=await Promise.all([
    apiCached('/api/billing/balance',30000).catch(()=>null),
    apiCached('/api/billing/recharge-settings',30000).catch(()=>null),
    api('/api/billing/subscription').catch(()=>null),
  ]);
  window.updateCreditsPill(bal?.balanceUsd||0);
  $('#bal-val').textContent=fmtUsd(bal?.balanceUsd||0);
  $('#bal-sub').textContent=bal?'kullanıma hazır':'—';
  if(rc){
    $('#ar-tog').classList.toggle('on',!!rc.autoRechargeEnabled);
    $('#ar-info').textContent='Eşik: $'+rc.autoRechargeThreshold+' · Yüklenecek: $'+rc.autoRechargeAmount;
    const thEl=$('#ar-threshold');if(thEl&&!thEl.value)thEl.value=parseFloat(rc.autoRechargeThreshold).toFixed(2);
    const amEl=$('#ar-amount');if(amEl&&!amEl.value)amEl.value=parseFloat(rc.autoRechargeAmount).toFixed(2);
  }
  const tx=$('#tx-body');
  const txs=bal?.recentTransactions||[];
  if(!txs.length){tx.innerHTML='<div class="empty" style="padding:20px 0">Henüz işlem yok.</div>';}
  else{
    tx.innerHTML=`<table class="tbl"><thead><tr><th>TARİH</th><th>TÜR</th><th style="text-align:right">TUTAR</th><th style="text-align:right">BAKİYE</th></tr></thead><tbody>${txs.map(t=>{
      const amt=parseFloat(t.amountUsd);const sign=amt>=0?'+':'-';const col=amt>=0?'#4ADE80':'#F87171';
      return `<tr><td class="mono" style="font-size:12px;color:#98A3A3">${esc(fmtDate(t.createdAt))}</td>
        <td class="mono" style="font-size:12px;color:#C7CFCE">${esc(t.type)}</td>
        <td class="mono" style="text-align:right;color:${col}">${sign}${fmtUsd(Math.abs(amt))}</td>
        <td class="mono" style="text-align:right;color:#98A3A3">${fmtUsd(t.balanceAfter)}</td></tr>`;
    }).join('')}</tbody></table>`;
  }
  const sb=$('#sub-body');
  if(!sub?.subscription){sb.innerHTML='<div style="color:#98A3A3;font-size:13px">Aktif bir abonelik yok. Sadece kredi bazlı kullanım aktif.</div>';}
  else{
    const s=sub.subscription;
    sb.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
      <div><div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:4px">SEVİYE</div><div style="color:#F2F5F4;font-weight:600">${esc(s.tier)}</div></div>
      <div><div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:4px">DURUM</div><div>${s.status==='active'?'<span class="pill ok">Aktif</span>':'<span class="pill warn">'+esc(s.status)+'</span>'}</div></div>
      <div><div style="font:600 10px 'JetBrains Mono';color:#657172;letter-spacing:.14em;margin-bottom:4px">DÖNEM BİTİŞ</div><div class="mono" style="font-size:12px;color:#C7CFCE">${esc(fmtDate(s.currentPeriodEnd))}</div></div>
    </div>`;
  }
}

/* ---------- BOOT ---------- */
function renderProfileWidget(user){
  if(!user)return;
  const name=user.displayName||user.name||(user.email||'').split('@')[0]||'—';
  const nameEl=$('#profile-name');if(nameEl)nameEl.textContent=name;
  const av=$('#profile-avatar');
  if(av){
    if(user.avatarUrl){
      av.innerHTML='';
      const img=document.createElement('img');
      img.src=user.avatarUrl;img.alt=name;img.referrerPolicy='no-referrer';
      img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:7px;display:block';
      img.onerror=function(){av.innerHTML='';av.textContent=(name[0]||'U').toUpperCase();av.style.background='#DFFF00';av.style.color='#03090B';};
      av.style.background='#0B1518';av.appendChild(img);
    }else{
      av.textContent=(name[0]||'U').toUpperCase();
      av.style.background='#DFFF00';av.style.color='#03090B';
    }
  }
  window.__unichanl=window.__unichanl||{};window.__unichanl.user=user;
}
window.__unichanlRenderProfile=renderProfileWidget;

(async function boot(){
  try{
    const email=localStorage.getItem('unichanl_email');
    if(email){
      renderProfileWidget({email,displayName:null,avatarUrl:null,name:null});
    }
  }catch(_){}
  (async()=>{
    try{
      const me=await apiCached('/api/user/me',30000);
      if(me&&me.email){
        try{localStorage.setItem('unichanl_email',me.email);}catch(_){}
        renderProfileWidget(me);
      }
    }catch(_){/* silent — sidebar zaten email ile dolduruldu */}
  })();
  const start=(location.hash||'').replace(/^#\//,'')||'overview';
  await showView(start);
  try{document.getElementById('uc-skel')&&document.getElementById('uc-skel').remove();}catch(_){}
  try{
    if(performance&&performance.mark){
      performance.mark('uc:tti');
      if(performance.measure){performance.measure('uc:boot->tti','uc:boot-start','uc:tti');}
      const entries=performance.getEntriesByName('uc:boot->tti');
      const ms=entries&&entries.length?Math.round(entries[entries.length-1].duration):null;
      if(ms!=null&&window.ucTrack)ucTrack('perf_tti',{ms,view:start});
    }
  }catch(_){}
  if(window.ucTrack) ucTrack('dashboard_view',{view:start});
  if(location.search.indexOf('checkout=success')>-1 && window.ucTrack) ucTrack('payment_success',{});
})();
</script>
